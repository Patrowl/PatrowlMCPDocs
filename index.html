os pasos en orden y mantén el alcance entre un paso y otro:", "empty": "Ningún prompt coincide con «{q}». Prueba con una palabra más general, como activos, CVE o informe.", "pb_eyebrow": "Playbooks", "pb_h": "Encadena prompts en una rutina", "pb_p": "Cada playbook es una secuencia que ejecutas en una sola conversación. Claude conserva el alcance y las respuestas anteriores, así que cada paso se apoya en lo que ya ha leído. Copia el playbook completo para pegarlo como una única petición.", "tm_eyebrow": "Mapa de herramientas", "tm_h": "Qué consulta Claude detrás de cada pregunta", "tm_p": "Nunca llamas a las herramientas tú mismo. Este mapa te ayuda a formular preguntas que las herramientas pueden responder y muestra cuáles necesitan que indiques la organización.", "th_tool": "Herramienta", "th_answers": "Responde a", "th_filters": "Filtros útiles", "th_scope": "Alcance", "scope_all_visible": "todo lo visible", "scope_tenant": "tenant", "scope_domain_asset": "activo de dominio", "scope_default_org": "org. por defecto", "fn_eyebrow": "Notas de campo", "fn_h": "Obtén respuestas fiables", "legend": "Los prompts usan marcadores entre llaves. Los nombres de estado son los del dashboard: las vulnerabilidades usan new, ack, assigned, patched, closed y closed-risk-acceptance; los risk insights usan new, acknowledged, fixed, reopened, benign y risk_acceptance.", "date": "NOVIEMBRE 2026"}, "anatomy": {"aria": "Anatomía de un buen prompt", "eyebrow": "Anatomía de un prompt que obtiene una respuesta precisa", "action": "Lista los activos más recientes", "action_label": "Acción", "scope": "de Acme Corp", "scope_label": "Alcance", "window": "descubiertos desde el 2026-10-01", "window_label": "Periodo", "filter": "que no estén monitorizados,", "filter_label": "Filtro", "output": "en una tabla con un veredicto mantener / monitorizar / ignorar.", "output_label": "Formato", "p": "El alcance indica a Claude qué tenant u organización debe leer. Un periodo y un filtro mantienen los inventarios grandes dentro de los límites de las herramientas. Indicar el formato de salida te da una tabla, una lista ordenada o una página en lugar de un muro de texto."}, "placeholders": {"tenant": "Acme Group", "org": "Acme Corp", "domain": "acme.com", "cve": "CVE-2024-3400", "technology": "Fortinet FortiOS", "date": "2026-10-01"}, "cats": {"sum": {"name": "Resúmenes", "blurb": "Lecturas rápidas de tu situación. Úsalas para abrir una reunión o empezar la semana.", "prompts": [{"p": "Dame la postura de seguridad de {org} en un párrafo: vulnerabilidades abiertas por severidad, alertas sin reconocer y lo primero que hay que corregir.", "get": "Un estado en cinco líneas con una prioridad clara."}, {"p": "¿Qué ha cambiado en {org} desde {date}? Nuevos activos, nuevas vulnerabilidades, nuevos risk insights y nuevos dominios similares, de más reciente a más antiguo.", "get": "Un registro de cambios agrupado por tipo, con los totales arriba."}, {"p": "Resume todas las organizaciones del tenant {tenant} en una tabla: número de activos, cobertura de monitorización, críticas abiertas y hallazgos vencidos.", "get": "Una vista de cartera para MSSP o equipos de seguridad de grupo."}, {"p": "Explica los 3 principales riesgos de {org} a un director financiero en menos de 150 palabras. Sin jerga, una frase por riesgo sobre su impacto en el negocio.", "get": "Riesgos en lenguaje claro, listos para una diapositiva del consejo."}, {"p": "Genera el resumen de seguridad de {org} desde {date} y destaca todo lo que haya empeorado.", "get": "El resumen en markdown integrado, con las regresiones señaladas."}, {"p": "¿Qué organizaciones del tenant {tenant} necesitan atención esta semana y por qué? Ordénalas.", "get": "Una lista corta ordenada, con un motivo por organización."}]}, "rpt": {"name": "Informes", "blurb": "Documentos y páginas que entregas a otra persona. Pide el formato que necesites.", "prompts": [{"p": "Crea una página de briefing ejecutivo para {org}: la superficie de ataque de un vistazo, siete riesgos ordenados con evidencias y un plan a 30 días. Genérala como página HTML.", "get": "Una página para compartir, con cifras, gráficos y un plan."}, {"p": "Prepara la tabla mensual de KPI de {org}: nuevos activos, vulnerabilidades abiertas frente a cerradas, número de vencidas, tasa de cobertura y la tendencia respecto al mes anterior.", "get": "Una tabla de métricas para la revisión mensual del servicio."}, {"p": "Redacta un correo al cliente {org} que resuma los hallazgos altos y críticos de esta semana y las decisiones que necesitamos de su parte.", "get": "Un correo listo para enviar, con una petición clara."}, {"p": "Enumera cinco logros y cinco problemas abiertos de {org} para la revisión trimestral, cada uno con la evidencia que lo respalda.", "get": "Puntos de conversación equilibrados para una QBR."}, {"p": "Redacta una declaración de exposición externa de {org} lista para auditoría: alcance, metodología, cobertura, hallazgos abiertos y riesgos aceptados. Indica qué datos has usado y qué no has cubierto.", "get": "Evidencias para revisiones de ISO 27001, NIS2 o DORA."}, {"p": "Compara la cobertura de monitorización y las críticas abiertas de todas las organizaciones del tenant {tenant} y represéntalo en un gráfico.", "get": "Un gráfico comparativo para el reporting a nivel de grupo."}]}, "asa": {"name": "Superficie de ataque", "blurb": "Mapea lo que está expuesto, lo que es nuevo y lo que nadie vigila.", "prompts": [{"p": "Mapea la superficie de ataque de {org}: principales dominios, subdominios e IP, cuántos están activos y la cobertura de monitorización por criticidad.", "get": "La superficie en cifras, con las carencias por criticidad."}, {"p": "Lista los últimos activos que Patrowl ha descubierto para {org} y marca los que tengan nombres que sugieran algo sensible: admin, vpn, dev, test, api, backup, vault.", "get": "Nuevos descubrimientos, con los sensibles marcados."}, {"p": "¿Qué servicios están expuestos en {org}? Agrupa por separado bases de datos, acceso remoto, correo y transferencia de ficheros, con host y puerto.", "get": "Un inventario de servicios expuestos por familia."}, {"p": "¿Qué tecnologías se ejecutan en el perímetro de {org} y qué versiones parecen obsoletas?", "get": "Un inventario del stack con las versiones antiguas marcadas."}, {"p": "¿Qué IP del alcance de {org} pertenecen a CDN o proveedores SaaS y no deberían consumir créditos EASM?", "get": "Una lista de limpieza que libera créditos."}, {"p": "Muestra los subdominios de {domain} que están caídos pero siguen en DNS. ¿Cuáles podrían ser objeto de takeover?", "get": "Candidatos a subdomain takeover que hay que verificar."}]}, "vul": {"name": "Vulnerabilidades y riesgo", "blurb": "Trabaja la lista de hallazgos por plazo, impacto y esfuerzo.", "prompts": [{"p": "Lista las vulnerabilidades vencidas de {org}, ordenadas por severidad, con el activo, los días fuera de SLA y la corrección.", "get": "La lista de incumplimientos de SLA, de peor a mejor."}, {"p": "¿Qué vulnerabilidades de {org} vencen en los próximos 14 días?", "get": "Una vista de plazos para el próximo sprint."}, {"p": "Busca quick wins en {org}: severidad alta o crítica con poco esfuerzo de corrección.", "get": "Las correcciones con mejor retorno."}, {"p": "Muestra los risk insights altos y críticos de {org} marcados como benign o con riesgo aceptado, y cuestiona cada decisión.", "get": "Una segunda mirada al riesgo aceptado."}, {"p": "Agrupa los hallazgos abiertos de {org} por causa raíz: certificados, TLS, servicios expuestos, software obsoleto, seguridad del correo.", "get": "Temas que puedes resolver con un solo cambio cada uno."}, {"p": "¿Qué retests se han ejecutado en {org} desde {date} y qué correcciones han fallado?", "get": "Un panel del estado de las verificaciones."}]}, "cve": {"name": "Respuesta a CVE", "blurb": "De un CVE en titulares a una respuesta sobre tus propios activos en minutos.", "prompts": [{"p": "¿Nos afecta {cve}? Consulta primero el resultado de Patrowl sobre ataques en tendencia para {org} y luego lista los activos afectados con su criticidad, exposición y estado de monitorización.", "get": "Un sí o un no, con la lista de activos que lo demuestra."}, {"p": "¿Qué ataques en tendencia ha comprobado Patrowl en {org} desde {date} y cuáles han resultado con impacto o con posible impacto?", "get": "Nuevas amenazas ya probadas contra tus activos."}, {"p": "Usamos {technology}. ¿Qué CVE le aplican y qué activos de {org} la exponen a internet?", "get": "Correspondencia entre tecnología y exposición."}, {"p": "Redacta un aviso interno sobre {cve}: qué es, quién en {org} está expuesto, la mitigación y el plazo.", "get": "Un aviso de una página para difundir."}, {"p": "Lista los CVE que afectan a activos de {org} y que están en CISA KEV o tienen un exploit público, de mayor a menor severidad.", "get": "CVE ordenados por riesgo real."}, {"p": "Comprueba {cve} en todas las organizaciones del tenant {tenant} y dame una fila por organización.", "get": "La exposición de todo el grupo a un único CVE."}]}, "typ": {"name": "Typosquatting", "blurb": "Distingue la suplantación real de los nombres coincidentes y actúa sobre los que importan.", "prompts": [{"p": "Lista los dominios similares a {domain} registrados en los últimos 12 meses que tengan servidores de correo.", "get": "Los dominios con más probabilidad de enviar phishing."}, {"p": "Ordena los dominios similares de {org} por potencial de phishing: web activa, registros MX, registro reciente. Elimina duplicados primero.", "get": "Una lista corta ordenada en lugar de cientos de filas."}, {"p": "¿Cuáles de los dominios similares detectados son realmente nuestros? Crúzalos con la lista de activos de {org}.", "get": "Falsos positivos que marcar como propios."}, {"p": "Crea una cola de takedown para {org}: dominio, evidencia, registrador y el motivo por el que suplanta la marca.", "get": "Una cola con la que tu proveedor de takedown puede actuar."}, {"p": "¿Qué dominios similares de {org} en seguimiento han cambiado recientemente, por ejemplo un dominio aparcado que ahora tiene web activa o MX?", "get": "Dominios que acaban de volverse peligrosos."}, {"p": "Dibuja una línea temporal de cuándo se registró cada dominio similar a {domain} y destaca los recientes.", "get": "Un visual que muestra si el typosquatting va en aumento."}]}, "tri": {"name": "Triaje de activos", "blurb": "Decide qué vigilar, qué asumir como propio y qué descartar.", "prompts": [{"p": "Haz el triaje de los activos de {org} etiquetados como new: mantener, monitorizar o ignorar, con un motivo de una línea para cada uno.", "get": "Una decisión por activo que puedes aplicar en el dashboard."}, {"p": "¿Qué activos no protegidos de {org} deberíamos monitorizar primero, teniendo en cuenta los créditos EASM que le quedan al tenant {tenant}?", "get": "Una lista corta de monitorización que se ajusta al presupuesto."}, {"p": "Lista los activos de criticidad alta de {org} sin responsable.", "get": "Las carencias de responsabilidad que más importan."}, {"p": "¿Qué activos monitorizados de {org} están caídos? ¿Merece la pena seguir pagando por monitorizarlos?", "get": "Créditos que puedes recuperar."}, {"p": "Propón un nivel de criticidad para cada activo nuevo de {org} en función de su nombre, sus servicios expuestos y sus tecnologías.", "get": "Criticidad propuesta, con el razonamiento."}, {"p": "Busca activos de {org} con nombres que parezcan generados, como supportf01 o test-test, que estén caídos. ¿Podemos depurarlos?", "get": "Ruido de inventario que limpiar."}]}, "rem": {"name": "Plan de remediación", "blurb": "Convierte los hallazgos en trabajo ordenado, con responsables y prueba de corrección.", "prompts": [{"p": "Crea un plan de remediación a 30 días para {org}: pasos ordenados, rol responsable, esfuerzo y qué hallazgos cierra cada paso.", "get": "Un plan que puedes presentar y seguir."}, {"p": "¿Qué cambios individuales cerrarían de una vez el mayor número de hallazgos en {org}?", "get": "Correcciones de alto impacto, como una regla de firewall o un certificado."}, {"p": "Convierte los 10 principales hallazgos de {org} en tickets: título, activo, corrección y prueba de aceptación. Créalos en Linear.", "get": "Tickets en tu herramienta de seguimiento, listos para asignar."}, {"p": "Tras las correcciones, lista qué hay que volver a probar en {org} y comprueba cuántos créditos de retest le quedan al tenant {tenant}.", "get": "Un plan de retest que se ajusta a los créditos."}, {"p": "Reconoce todas las alertas de nivel informativo de {org} con más de 30 días. Muéstrame la lista antes de actuar.", "get": "Una cola de alertas más limpia, tras tu confirmación."}, {"p": "Redacta el estado de la remediación de {org} como una actualización de una página: hecho, en curso, bloqueado y lo que necesitamos del cliente.", "get": "Una actualización de estado para la llamada semanal."}]}}, "books": [{"title": "Briefing del lunes", "when": "Semanal · 5 minutos", "steps": [["Usa el tenant {tenant}.", "Fija el alcance de la conversación."], ["¿Qué ha cambiado en {org} en los últimos 7 días?", "Nuevos activos, hallazgos y dominios similares."], ["Lista las vulnerabilidades vencidas y las que vencen esta semana.", "Los plazos que importan."], ["Dame tres prioridades para esta semana, en una línea cada una.", "El plan de la semana."]]}, {"title": "Triaje de nuevos activos", "when": "Tras cada oleada de descubrimiento", "steps": [["Lista los últimos activos que Patrowl ha encontrado para {org}, de más reciente a más antiguo.", "Lo que ha añadido el descubrimiento."], ["Marca los nombres sensibles y comprueba cuáles están activos.", "Separa los hosts reales del ruido."], ["Recomienda cuáles monitorizar con los créditos EASM restantes.", "Se ajusta al presupuesto."], ["Propón una criticidad y un rol responsable para cada activo que se mantenga.", "Listo para aplicar."]]}, {"title": "Simulacro de CVE", "when": "Cuando un CVE sale en las noticias", "steps": [["Explica {cve} en cinco líneas.", "Primero, un entendimiento común."], ["¿Qué activos de {org} están afectados o ejecutan el producto vulnerable?", "Tu exposición real."], ["¿Alguno de ellos está expuesto a internet y sin monitorizar?", "El subconjunto urgente."], ["Redacta el aviso y crea tickets para cada activo afectado.", "Acción, no solo concienciación."]]}, {"title": "Takedown de dominios similares", "when": "Mensual", "steps": [["Lista los dominios similares de {org}, sin duplicados.", "Elimina las repeticiones por dominio."], ["Descarta los que son nuestros o nombres coincidentes de larga data.", "Reduce los falsos positivos."], ["Ordena el resto por MX, web activa y fecha de registro.", "Potencial de phishing."], ["Crea la cola de takedown con evidencias.", "Lista para el proveedor."]]}, {"title": "Remediación a 30 días", "when": "Tras una evaluación", "steps": [["Agrupa los hallazgos abiertos de {org} por causa raíz.", "Menos correcciones, pero de más alcance."], ["Ordena las correcciones por riesgo eliminado por hora de esfuerzo.", "El mejor retorno primero."], ["Convierte cada paso en un ticket con una prueba de aceptación.", "Trabajo con seguimiento."], ["Lista qué volver a probar cuando se complete cada paso.", "La prueba de que está corregido."]]}, {"title": "Briefing ejecutivo", "when": "Mensual o trimestral", "steps": [["Genera un resumen ejecutivo de la superficie de ataque y los principales riesgos de {org}.", "El relato."], ["Comprueba las cifras: elimina duplicados e indica qué datos has usado.", "Un informe que puedes defender."], ["Genéralo como página HTML con una lista ordenada de riesgos y un plan a 30 días.", "Algo que compartir."], ["Redacta el correo de presentación para el cliente.", "Enviado el mismo día."]]}], "tools": ["Qué clientes y organizaciones puedes ver", "Créditos EASM, slots de pentest y créditos de retest usados y restantes", "Tamaño de la superficie, qué está activo, cobertura de monitorización, crecimiento en N días", "Inventario, descubrimientos más recientes, activos sin monitorizar o caídos", "Subdominios que EASM ha encontrado bajo un dominio", "Fabricantes, productos y versiones detectados en el perímetro", "Hallazgos abiertos, vencidos y próximos a vencer, con guía de corrección", "Totales por severidad, críticas abiertas, alertas sin reconocer", "Hallazgos críticos abiertos (new, ack o assigned)", "Servicios expuestos, certificados, TLS, seguridad del correo", "CVE en tus activos, con indicadores de CISA KEV y de exploit conocido", "Comprobaciones de Patrowl sobre amenazas recién publicadas y si tus activos han resultado afectados", "Dominios similares con registrador y estado de MX, web y aparcamiento", "Qué ha saltado y qué no ha revisado nadie", "Reconocer alertas. Modifica datos; Claude pregunta antes", "Qué correcciones se han verificado y cuáles han fallado", "Un resumen de postura en markdown ya preparado"], "notes": [{"h": "Indica el alcance una sola vez", "p": "Di «usa el tenant Acme» al principio. Claude resuelve el tenant en sus organizaciones y mantiene ese alcance durante el resto de la conversación."}, {"h": "Cuidado con las herramientas de org. por defecto", "p": "Vulnerabilidades, alertas, retests y postura leen tu organización por defecto. Si gestionas varias, pide a Claude que confirme qué organización ha leído o que consulte las vulnerabilidades activo por activo."}, {"h": "Cuenta antes de listar", "p": "En tenants grandes, pide primero las estadísticas y luego profundiza en un segmento concreto. Las extracciones completas del inventario pueden detenerse cerca de los 8.000 registros; una fecha <code>since</code> o un filtro <code>protection</code> las mantiene pequeñas."}, {"h": "Pide que elimine duplicados", "p": "Los resultados paginados pueden repetir filas, y las detecciones de dominios similares se repiten una vez por cada dominio protegido. Pide a Claude que cuente los elementos únicos antes de dar una cifra."}, {"h": "Pregunta qué se ha leído", "p": "Termina los prompts de informes con «indica qué datos has usado y qué no has cubierto». Así el informe incluye sus propios límites, algo importante cuando se entrega a un cliente."}, {"h": "El MCP es de solo lectura", "p": "Lee tus datos de Patrowl para responder a tus preguntas y no puede crear, editar ni eliminar nada en tu cuenta."}], "x": {"cta_install": "Instalar en 3 pasos", "cta_prompts": "Explora los 48 prompts", "demo": {"label": "Ejemplo", "you": "Tú", "assistant": "Claude + Patrowl", "prompt": "¿Nos afecta CVE-2024-3400? Consulta primero el resultado de Patrowl sobre ataques en tendencia para Acme Corp.", "reading": "Leyendo Patrowl", "answer": "Sí. 2 activos de Acme Corp expuestos a internet ejecutan la versión vulnerable. Ambos son críticos y uno aún no está monitorizado: empieza por ahí.", "note": "Respuesta ilustrativa, no son datos reales.", "replay": "Repetir"}, "sections": {"install_eyebrow": "Sección 01", "install_h": "Conecta tu asistente", "install_p": "Tres pasos, sin token de API y sin código. Elige el asistente que uses.", "prompts_eyebrow": "Sección 02", "prompts_h": "Biblioteca de prompts", "prompts_p": "48 prompts en 8 categorías. Indica tu alcance una sola vez y luego copia.", "pb_eyebrow": "Sección 03", "tm_eyebrow": "Sección 04", "fn_eyebrow": "Sección 05"}, "install": {"before_h": "Antes de empezar", "f1_h": "Sin token de API", "f1_p": "Inicias sesión una sola vez con tu cuenta de Patrowl Dashboard, en tu navegador.", "f2_h": "Se aplican tus permisos", "f2_p": "El asistente solo ve los datos que puede ver tu cuenta de Patrowl.", "f3_h": "Sesiones", "f3_p": "Una sesión termina tras 8 horas sin uso o 7 días después de iniciar sesión. Entonces, vuelve a conectarte.", "pick": "Tu asistente", "works_in": "Funciona en", "step": "Paso", "copy": "Copiar", "url_label": "URL del servidor", "claude": {"tab": "Claude", "works": "claude.ai, Claude Desktop, móvil y Claude Code", "s1_h": "Añade el conector", "s1_p": "En claude.ai o Claude Desktop, abre Settings → Connectors → Add custom connector. Llámalo Patrowl, pega la URL del servidor y deja vacíos los campos OAuth Client ID y Secret. Haz clic en Add.", "s1_note": "¿Tu administrador ya ha añadido Patrowl para todos? Pasa al paso 2.", "s2_h": "Inicia sesión", "s2_p": "Haz clic en Connect junto a Patrowl, aprueba la página de consentimiento e inicia sesión con tu cuenta de Patrowl Dashboard. El conector muestra Connected.", "s3_h": "Pregunta", "s3_p": "En un chat nuevo, abre el menú + y comprueba que Patrowl está activado. El conector va ligado a tu cuenta de Claude: también funciona en el móvil y en Claude Code."}, "code": {"tab": "Claude Code", "works": "Claude Code en el terminal y la pestaña Code de Claude Desktop", "s1_h": "Añade el servidor", "s1_p": "Abre un terminal (Terminal en macOS, PowerShell en Windows) y ejecuta este comando. --scope user hace que Patrowl esté disponible en todas las carpetas.", "s2_h": "Inicia sesión", "s2_p": "Inicia claude, escribe /mcp, selecciona patrowl y luego Authenticate. Aprueba la página de consentimiento e inicia sesión con tu cuenta de Patrowl Dashboard. El terminal muestra Authentication successful.", "s3_h": "Pregunta", "s3_p": "Pregunta en cualquier sesión de Claude Code. En Claude Desktop, abre la pestaña Code e inicia una sesión Local."}, "claude_warn": "Elige el conector de Claude o Claude Code, no ambos: con los dos, Claude carga cada herramienta de Patrowl dos veces.", "chatgpt": {"tab": "ChatGPT", "works": "chatgpt.com, en la web", "req": "Requiere un plan ChatGPT Business, Enterprise o Edu. Puede que el administrador de tu espacio de trabajo tenga que permitir antes las apps personalizadas (developer mode).", "s1_h": "Añade la app", "s1_p": "En chatgpt.com, abre Settings → Apps y haz clic en Create. Si se te pide, activa Developer mode. Llámala Patrowl, pega la URL del servidor, elige OAuth y deja vacíos los campos Client ID y Secret. Acepta la advertencia y luego haz clic en Create.", "s1_note": "¿Tu administrador ya ha publicado Patrowl para el espacio de trabajo? Pasa al paso 2.", "s2_h": "Inicia sesión", "s2_p": "Haz clic en Connect en la app Patrowl, aprueba la página de consentimiento e inicia sesión con tu cuenta de Patrowl Dashboard. La app muestra Connected.", "s3_h": "Pregunta", "s3_p": "En un chat, haz clic en + junto al cuadro de mensaje, luego en More, y selecciona Patrowl. ChatGPT solo usa Patrowl cuando la app está seleccionada."}, "codex": {"tab": "Codex", "works": "Codex CLI y la app de escritorio de Codex", "s1_h": "Añade el servidor", "s1_p": "En un terminal, ejecuta este comando. Guarda Patrowl en ~/.codex/config.toml para todas las carpetas.", "s2_h": "Inicia sesión", "s2_p": "Ejecuta este comando. Se abre tu navegador: aprueba la página de consentimiento e inicia sesión con tu cuenta de Patrowl Dashboard.", "s3_h": "Pregunta", "s3_p": "Ejecuta codex mcp list para comprobar que patrowl aparece en la lista y luego pregunta. En la app de escritorio, revisa Settings → MCP servers."}, "expired": "¿Ha caducado la sesión? Vuelve a conectarte igual que en el paso 2."}}}, "de": {"lang": "de", "name": "Deutsch", "ui": {"eyebrow": "PatrowlMCP · Prompt-Book · 48 Prompts, 6 Playbooks", "h1_main": "Frag deine Angriffsfläche", "h1_accent": "alles.", "lede_before": "PatrowlMCP verbindet Claude mit dem Patrowl-Dashboard. Du fragst in natürlicher Sprache; Claude liest deine", "lede_bold": "Assets, Schwachstellen, Risk Insights, CVEs und Lookalike-Domains", "lede_after": " und schreibt dann die Zusammenfassung, den Bericht oder den Remediation-Plan. Hier findest du Prompts, die funktionieren, gruppiert nach deiner Aufgabe.", "lang_label": "Sprache", "scope_aria": "Deinen Scope eintragen", "eg": "z. B.", "clear": "Leeren", "scope_note": "Einmal ausfüllen. Alle Prompts und Playbooks auf der Seite werden aktualisiert, und „Kopieren“ legt den ausgefüllten Text in deine Zwischenablage. Die Werte bleiben nur in diesem Browser.", "categories_aria": "Kategorien", "library_aria": "Prompt-Bibliothek", "all_code": "ALLE", "all_name": "Alle Prompts", "search_label": "Prompts durchsuchen", "search_placeholder": "z. B. überfällig, MX, Credits", "prompts_count": "Prompts", "copy": "Kopieren", "copy_playbook": "Playbook kopieren", "copied": "Kopiert", "copy_fallback": "Markieren und manuell kopieren", "playbook_header": "Führe diese Schritte nacheinander aus und behalte den Scope zwischen den Schritten bei:", "empty": "Kein Prompt passt zu „{q}“. Versuch es mit einem allgemeineren Begriff wie Assets, CVE oder Bericht.", "pb_eyebrow": "Playbooks", "pb_h": "Prompts zu einer Routine verketten", "pb_p": "Jedes Playbook ist eine Abfolge, die du in einer einzigen Unterhaltung ausführst. Claude behält den Scope und die früheren Antworten, sodass spätere Schritte auf dem aufbauen, was bereits gelesen wurde. Kopiere das ganze Playbook, um es als eine einzige Anfrage einzufügen.", "tm_eyebrow": "Tool-Übersicht", "tm_h": "Was Claude hinter jeder Frage aufruft", "tm_p": "Du rufst Tools nie selbst auf. Diese Übersicht hilft dir, Fragen so zu formulieren, dass die Tools sie beantworten können, und zeigt, bei welchen du die Organisation nennen musst.", "th_tool": "Tool", "th_answers": "Beantwortet", "th_filters": "Nützliche Filter", "th_scope": "Scope", "scope_all_visible": "alle sichtbaren", "scope_tenant": "Tenant", "scope_domain_asset": "Domain-Asset", "scope_default_org": "Standard-Org", "fn_eyebrow": "Praxistipps", "fn_h": "Antworten, denen du vertrauen kannst", "legend": "Prompts verwenden Platzhalter in geschweiften Klammern. Die Statusnamen entsprechen dem Dashboard: Schwachstellen verwenden new, ack, assigned, patched, closed und closed-risk-acceptance; Risk Insights verwenden new, acknowledged, fixed, reopened, benign und risk_acceptance.", "date": "NOVEMBER 2026"}, "anatomy": {"aria": "Aufbau eines guten Prompts", "eyebrow": "Aufbau eines Prompts, der eine präzise Antwort liefert", "action": "Zeig die neuesten Assets", "action_label": "Aktion", "scope": "von Acme Corp,", "scope_label": "Scope", "window": "entdeckt seit 2026-10-01,", "window_label": "Zeitfenster", "filter": "die nicht überwacht werden,", "filter_label": "Filter", "output": "als Tabelle mit dem Urteil behalten / überwachen / ignorieren.", "output_label": "Ausgabe", "p": "Der Scope legt fest, welchen Tenant oder welche Organisation Claude liest. Ein Zeitfenster und ein Filter halten große Inventare innerhalb der Tool-Limits. Wenn du das Ausgabeformat nennst, bekommst du eine Tabelle, eine Rangliste oder eine Seite statt einer Textwand."}, "placeholders": {"tenant": "Acme Group", "org": "Acme Corp", "domain": "acme.com", "cve": "CVE-2024-3400", "technology": "Fortinet FortiOS", "date": "2026-10-01"}, "cats": {"sum": {"name": "Zusammenfassungen", "blurb": "Schnell sehen, wo du stehst. Ideal als Einstieg in ein Meeting oder eine Woche.", "prompts": [{"p": "Fasse die Sicherheitslage von {org} in einem Absatz zusammen: offene Schwachstellen nach Schweregrad, nicht quittierte Alerts und die eine Sache, die zuerst behoben werden sollte.", "get": "Ein Status in fünf Zeilen mit einer klaren Priorität."}, {"p": "Was hat sich bei {org} seit {date} geändert? Neue Assets, neue Schwachstellen, neue Risk Insights und neue Lookalike-Domains, die neuesten zuerst.", "get": "Ein Änderungsprotokoll, nach Typ gruppiert, mit den Zahlen oben."}, {"p": "Fasse alle Organisationen im Tenant {tenant} in einer Tabelle zusammen: Anzahl Assets, Monitoring-Abdeckung, offene kritische und überfällige Findings.", "get": "Eine Portfolioansicht für MSSPs oder Konzern-Security-Teams."}, {"p": "Erkläre einem CFO die drei größten Risiken von {org} in unter 150 Wörtern. Kein Fachjargon, je ein Satz zur geschäftlichen Auswirkung.", "get": "Risikoaussagen in klarer Sprache, bereit für eine Vorstandsfolie."}, {"p": "Erstelle die Sicherheitszusammenfassung für {org} seit {date} und hebe alles hervor, was sich verschlechtert hat.", "get": "Die integrierte Markdown-Zusammenfassung mit hervorgehobenen Verschlechterungen."}, {"p": "Welche Organisationen im Tenant {tenant} brauchen diese Woche Aufmerksamkeit, und warum? Erstelle eine Rangfolge.", "get": "Eine kurze Rangliste mit einem Grund pro Organisation."}]}, "rpt": {"name": "Reporting", "blurb": "Dokumente und Seiten, die du an andere weitergibst. Frag nach dem Format, das du brauchst.", "prompts": [{"p": "Erstelle eine Executive-Briefing-Seite für {org}: die Angriffsfläche auf einen Blick, sieben priorisierte Risiken mit Belegen und einen 30-Tage-Plan. Gib sie als HTML-Seite aus.", "get": "Eine teilbare Seite mit Zahlen, Diagrammen und Plan."}, {"p": "Erstelle die monatliche KPI-Tabelle für {org}: neue Assets, eröffnete vs. geschlossene Schwachstellen, Anzahl überfälliger Findings, Abdeckungsrate und den Trend gegenüber dem Vormonat.", "get": "Eine Kennzahlentabelle für das monatliche Service-Review."}, {"p": "Entwirf eine Kunden-E-Mail für {org}, die die hohen und kritischen Findings dieser Woche zusammenfasst und die Entscheidungen nennt, die wir vom Kunden brauchen.", "get": "Eine versandfertige E-Mail mit einem klaren Anliegen."}, {"p": "Nenne fünf Erfolge und fünf offene Punkte für {org} für das Quartalsreview, jeweils mit den zugrunde liegenden Belegen.", "get": "Ausgewogene Gesprächspunkte für ein QBR."}, {"p": "Verfasse eine auditfähige Darstellung der externen Exposition von {org}: Scope, Methode, Abdeckung, offene Findings, akzeptierte Risiken. Gib an, welche Daten du verwendet und was du nicht abgedeckt hast.", "get": "Nachweise für Prüfungen nach ISO 27001, NIS2 oder DORA."}, {"p": "Vergleiche Monitoring-Abdeckung und offene kritische Findings über alle Organisationen des Tenants {tenant} und stelle das als Diagramm dar.", "get": "Ein Vergleichsdiagramm für das Reporting auf Konzernebene."}]}, "asa": {"name": "Angriffsfläche", "blurb": "Erfasse, was exponiert ist, was neu ist und was niemand im Blick hat.", "prompts": [{"p": "Erfasse die Angriffsfläche von {org}: wichtigste Domains, Subdomains und IPs, wie viele davon online sind, und die Monitoring-Abdeckung nach Kritikalität.", "get": "Die Angriffsfläche in Zahlen, mit Lücken nach Kritikalität."}, {"p": "Liste die neuesten Assets auf, die Patrowl für {org} entdeckt hat, und markiere die, deren Namen auf etwas Sensibles hindeuten: admin, vpn, dev, test, api, backup, vault.", "get": "Neue Funde, sensible Assets markiert."}, {"p": "Welche Dienste sind bei {org} exponiert? Gruppiere Datenbanken, Fernzugriff, Mail und Dateiübertragung getrennt, jeweils mit Host und Port.", "get": "Ein Inventar exponierter Dienste nach Kategorie."}, {"p": "Welche Technologien laufen am Perimeter von {org}, und welche Versionen wirken veraltet?", "get": "Ein Stack-Inventar mit markierten veralteten Versionen."}, {"p": "Welche IPs im Scope von {org} gehören zu CDNs oder SaaS-Anbietern und sollten keine EASM-Credits verbrauchen?", "get": "Eine Bereinigungsliste, die Credits freimacht."}, {"p": "Zeig die Subdomains von {domain}, die offline sind, aber noch im DNS stehen. Welche könnten übernommen werden?", "get": "Kandidaten für Subdomain-Takeover, die du prüfen solltest."}]}, "vul": {"name": "Schwachstellen & Risiken", "blurb": "Arbeite die Findings nach Frist, Auswirkung und Aufwand ab.", "prompts": [{"p": "Liste die überfälligen Schwachstellen von {org} auf, sortiert nach Schweregrad, mit Asset, Tagen seit SLA-Überschreitung und Fix.", "get": "Die Liste der SLA-Verstöße, die schlimmsten zuerst."}, {"p": "Welche Schwachstellen von {org} sind in den nächsten 14 Tagen fällig?", "get": "Eine Fristenübersicht für den kommenden Sprint."}, {"p": "Finde Quick Wins bei {org}: hoher oder kritischer Schweregrad bei geringem Behebungsaufwand.", "get": "Die Fixes mit dem besten Kosten-Nutzen-Verhältnis."}, {"p": "Zeig die Risk Insights mit hohem und kritischem Schweregrad bei {org}, die als harmlos markiert oder als Risiko akzeptiert wurden, und hinterfrage jede Entscheidung.", "get": "Ein zweiter Blick auf akzeptierte Risiken."}, {"p": "Gruppiere die offenen Findings von {org} nach Ursache: Zertifikate, TLS, exponierte Dienste, veraltete Software, Mail-Sicherheit.", "get": "Themen, die du mit jeweils einer einzigen Änderung beheben kannst."}, {"p": "Welche Retests liefen seit {date} für {org}, und welche Fixes sind fehlgeschlagen?", "get": "Eine Übersicht zum Verifizierungsstatus."}]}, "cve": {"name": "CVE-Response", "blurb": "Von der CVE in den Schlagzeilen zur Antwort über deine eigenen Assets – in Minuten.", "prompts": [{"p": "Sind wir von {cve} betroffen? Prüfe zuerst das Ergebnis des Patrowl-Trending-Attack-Checks für {org} und liste dann die betroffenen Assets mit Kritikalität, Exposition und Monitoring-Status auf.", "get": "Ein Ja oder Nein, mit der Asset-Liste als Beleg."}, {"p": "Welche Trending Attacks hat Patrowl seit {date} bei {org} geprüft, und bei welchen lautete das Ergebnis „betroffen“ oder „möglicherweise betroffen“?", "get": "Neue Bedrohungen, die bereits gegen deine Assets getestet wurden."}, {"p": "Wir setzen {technology} ein. Welche CVEs betreffen es, und welche Assets von {org} machen es aus dem Internet erreichbar?", "get": "Zuordnung von Technologie zu Exposition."}, {"p": "Schreib ein internes Advisory zu {cve}: worum es geht, wer bei {org} exponiert ist, die Gegenmaßnahme und die Frist.", "get": "Ein einseitiges Advisory zum Verteilen."}, {"p": "Liste die CVEs auf, die Assets von {org} betreffen und im CISA KEV stehen oder einen öffentlichen Exploit haben, höchster Schweregrad zuerst.", "get": "CVEs nach realem Risiko priorisiert."}, {"p": "Prüfe jede Organisation im Tenant {tenant} auf {cve} und gib mir eine Zeile pro Organisation.", "get": "Konzernweite Exposition gegenüber einer einzelnen CVE."}]}, "typ": {"name": "Typosquatting", "blurb": "Trenne echte Imitationen von Namensvettern und handle bei denen, die zählen.", "prompts": [{"p": "Liste die Lookalike-Domains von {domain} auf, die in den letzten 12 Monaten registriert wurden und Mailserver haben.", "get": "Die Domains, von denen am ehesten Phishing ausgeht."}, {"p": "Ordne die Lookalikes von {org} nach Phishing-Potenzial: aktive Website, MX-Records, kürzliche Registrierung. Dedupliziere vorher.", "get": "Eine priorisierte Shortlist statt Hunderter Zeilen."}, {"p": "Welche erkannten Lookalikes gehören tatsächlich uns? Gleiche sie mit der Asset-Liste von {org} ab.", "get": "False Positives, die du als eigene markieren kannst."}, {"p": "Erstelle eine Takedown-Queue für {org}: Domain, Belege, Registrar und den Grund, warum sie die Marke imitiert.", "get": "Eine Queue, mit der dein Takedown-Anbieter arbeiten kann."}, {"p": "Welche beobachteten Lookalikes von {org} haben sich kürzlich verändert, zum Beispiel eine geparkte Domain, die jetzt eine aktive Website oder MX hat?", "get": "Domains, die gerade gefährlich geworden sind."}, {"p": "Zeichne eine Zeitleiste, wann jedes Lookalike von {domain} registriert wurde, und hebe die neuen hervor.", "get": "Eine Visualisierung, die zeigt, ob Typosquatting zunimmt."}]}, "tri": {"name": "Asset-Triage", "blurb": "Entscheide, was du überwachst, was du übernimmst und was du verwirfst.", "prompts": [{"p": "Triagiere die Assets von {org} mit dem Tag „new“: behalten, überwachen oder ignorieren, jeweils mit einer einzeiligen Begründung.", "get": "Eine Entscheidung pro Asset, die du im Dashboard umsetzen kannst."}, {"p": "Welche ungeschützten Assets von {org} sollten wir angesichts der verbleibenden EASM-Credits im Tenant {tenant} zuerst überwachen?", "get": "Eine Monitoring-Shortlist, die ins Budget passt."}, {"p": "Liste die Assets von {org} mit hoher Kritikalität auf, die keinen Owner haben.", "get": "Die wichtigsten Lücken bei der Verantwortlichkeit."}, {"p": "Welche überwachten Assets von {org} sind offline? Sollten wir weiter für ihr Monitoring zahlen?", "get": "Credits, die du zurückholen kannst."}, {"p": "Schlag für jedes neue Asset von {org} eine Kritikalitätsstufe vor, basierend auf Name, exponierten Diensten und Technologien.", "get": "Vorgeschlagene Kritikalität mit Begründung."}, {"p": "Finde Assets von {org} mit generiert wirkenden Namen wie supportf01 oder test-test, die offline sind. Können wir sie entfernen?", "get": "Rauschen im Inventar, das du bereinigen kannst."}]}, "rem": {"name": "Remediation-Plan", "blurb": "Mach aus Findings geordnete Aufgaben mit Verantwortlichen und Nachweis der Behebung.", "prompts": [{"p": "Erstelle einen 30-Tage-Remediation-Plan für {org}: geordnete Schritte, verantwortliche Rolle, Aufwand und welche Findings jeder Schritt schließt.", "get": "Ein Plan, den du präsentieren und nachverfolgen kannst."}, {"p": "Welche einzelnen Änderungen würden bei {org} auf einen Schlag die meisten Findings schließen?", "get": "Fixes mit großer Hebelwirkung, etwa eine Firewall-Regel oder ein Zertifikat."}, {"p": "Mach aus den Top-10-Findings von {org} Tickets: Titel, Asset, Fix, Abnahmetest. Lege sie in Linear an.", "get": "Tickets in deinem Tracker, bereit zur Zuweisung."}, {"p": "Liste nach den Fixes auf, was bei {org} erneut getestet werden muss, und prüfe, wie viele Retest-Credits der Tenant {tenant} noch hat.", "get": "Ein Retest-Plan, der zu den Credits passt."}, {"p": "Quittiere alle Alerts der Stufe Information bei {org}, die älter als 30 Tage sind. Zeig mir die Liste, bevor du handelst.", "get": "Eine aufgeräumtere Alert-Queue, nach deiner Freigabe."}, {"p": "Schreib den Remediation-Status für {org} als einseitiges Update: erledigt, in Arbeit, blockiert und was wir vom Kunden brauchen.", "get": "Ein Status-Update für den wöchentlichen Call."}]}}, "books": [{"title": "Montags-Briefing", "when": "Wöchentlich · 5 Minuten", "steps": [["Nutze den Tenant {tenant}.", "Legt den Scope für die Unterhaltung fest."], ["Was hat sich bei {org} in den letzten 7 Tagen geändert?", "Neue Assets, Findings und Lookalikes."], ["Liste überfällige und diese Woche fällige Schwachstellen auf.", "Die Fristen, die zählen."], ["Nenne mir drei Prioritäten für diese Woche, je in einer Zeile.", "Der Plan für die Woche."]]}, {"title": "Triage neuer Assets", "when": "Nach jeder Discovery-Welle", "steps": [["Liste die neuesten Assets auf, die Patrowl für {org} gefunden hat, die neuesten zuerst.", "Was die Discovery hinzugefügt hat."], ["Markiere sensible Namen und prüfe, welche online sind.", "Trennt echte Hosts vom Rauschen."], ["Empfiehl, welche im Rahmen der verbleibenden EASM-Credits überwacht werden sollen.", "Passt ins Budget."], ["Schlag für jedes behaltene Asset eine Kritikalität und eine verantwortliche Rolle vor.", "Bereit zur Umsetzung."]]}, {"title": "CVE-Notfallübung", "when": "Wenn eine CVE in den Nachrichten ist", "steps": [["Erkläre {cve} in fünf Zeilen.", "Erst ein gemeinsames Verständnis."], ["Welche Assets von {org} sind betroffen oder setzen das verwundbare Produkt ein?", "Deine tatsächliche Exposition."], ["Sind davon welche aus dem Internet erreichbar und nicht überwacht?", "Die dringende Teilmenge."], ["Schreib das Advisory und erstelle Tickets für jedes betroffene Asset.", "Handeln, nicht nur informieren."]]}, {"title": "Lookalike-Takedown", "when": "Monatlich", "steps": [["Liste die Lookalikes von {org} dedupliziert auf.", "Entfernt Wiederholungen pro Domain."], ["Entferne die, die uns gehören oder langjährige Namensvettern sind.", "Reduziert False Positives."], ["Ordne den Rest nach MX, aktiver Website und Registrierungsdatum.", "Phishing-Potenzial."], ["Erstelle die Takedown-Queue mit Belegen.", "Bereit für den Anbieter."]]}, {"title": "30-Tage-Remediation", "when": "Nach einem Assessment", "steps": [["Gruppiere die offenen Findings von {org} nach Ursache.", "Weniger, dafür größere Fixes."], ["Ordne die Fixes nach beseitigtem Risiko pro Stunde Aufwand.", "Bester Ertrag zuerst."], ["Mach aus jedem Schritt ein Ticket mit Abnahmetest.", "Nachverfolgbare Arbeit."], ["Liste auf, was nach Abschluss jedes Schritts erneut getestet werden soll.", "Der Nachweis, dass es behoben ist."]]}, {"title": "Executive Briefing", "when": "Monatlich oder quartalsweise", "steps": [["Erstelle eine Executive Summary der Angriffsfläche und der Hauptrisiken von {org}.", "Das Narrativ."], ["Prüfe die Zahlen: Dedupliziere und gib an, welche Daten du verwendet hast.", "Ein Bericht, den du vertreten kannst."], ["Gib es als HTML-Seite mit priorisierter Risikoliste und 30-Tage-Plan aus.", "Etwas zum Teilen."], ["Entwirf die Begleit-E-Mail an den Kunden.", "Noch am selben Tag verschickt."]]}], "tools": ["Welche Kunden und Organisationen du sehen kannst", "Verbrauchte und verbleibende EASM-Credits, Pentest-Slots und Retest-Credits", "Größe der Angriffsfläche, was online ist, Monitoring-Abdeckung, Wachstum über N Tage", "Inventar, neueste Funde, nicht überwachte oder nicht erreichbare Assets", "Subdomains, die EASM unter einer Domain gefunden hat", "Hersteller, Produkte und Versionen am Perimeter", "Offene, überfällige und bald fällige Findings mit Hinweisen zur Behebung", "Anzahl nach Schweregrad, offene kritische Findings, nicht quittierte Alerts", "Offene kritische Findings (new, ack oder assigned)", "Exponierte Dienste, Zertifikate, TLS, Mail-Sicherheit", "CVEs auf deinen Assets, mit Kennzeichnung für CISA KEV und bekannte Exploits", "Patrowl-Checks für neu veröffentlichte Bedrohungen und ob deine Assets betroffen sind", "Lookalike-Domains mit Registrar-, MX-, Web- und Parking-Status", "Was ausgelöst wurde und was sich noch niemand angesehen hat", "Alerts quittieren. Ändert Daten; Claude fragt vorher", "Welche Fixes verifiziert wurden und welche fehlgeschlagen sind", "Eine fertige Posture-Zusammenfassung in Markdown"], "notes": [{"h": "Nenne den Scope einmal", "p": "Sag zu Beginn „nutze Tenant Acme“. Claude löst den Tenant in seine Organisationen auf und behält diesen Scope für den Rest der Unterhaltung bei."}, {"h": "Achte auf die Tools mit Standard-Org", "p": "Schwachstellen, Alerts, Retests und Posture lesen deine Standardorganisation. Wenn du mehrere verwaltest, lass Claude bestätigen, welche Organisation gelesen wurde, oder die Schwachstellen Asset für Asset abfragen."}, {"h": "Erst zählen, dann auflisten", "p": "Frag bei großen Tenants zuerst nach Statistiken und geh dann in einen einzelnen Ausschnitt. Vollständige Inventarabrufe können bei etwa 8.000 Datensätzen abbrechen; ein <code>since</code>-Datum oder ein <code>protection</code>-Filter hält sie klein."}, {"h": "Bitte um Deduplizierung", "p": "Seitenweise abgerufene Ergebnisse können Zeilen wiederholen, und Lookalike-Erkennungen tauchen einmal pro geschützter Domain auf. Lass Claude eindeutige Einträge zählen, bevor eine Zahl im Bericht landet."}, {"h": "Frag, was gelesen wurde", "p": "Beende Reporting-Prompts mit „gib an, welche Daten du verwendet und was du nicht abgedeckt hast“. Der Bericht nennt dann seine eigenen Grenzen – wichtig, wenn er an einen Kunden geht."}, {"h": "Der MCP ist schreibgeschützt", "p": "Er liest deine Patrowl-Daten, um deine Fragen zu beantworten, und kann in deinem Konto nichts erstellen, bearbeiten oder löschen."}], "x": {"cta_install": "In 3 Schritten installieren", "cta_prompts": "Die 48 Prompts ansehen", "demo": {"label": "Beispiel", "you": "Du", "assistant": "Claude + Patrowl", "prompt": "Sind wir von CVE-2024-3400 betroffen? Prüfe zuerst das Ergebnis des Patrowl-Trending-Attack-Checks für Acme Corp.", "reading": "Liest Patrowl", "answer": "Ja. 2 aus dem Internet erreichbare Assets von Acme Corp laufen mit der verwundbaren Version. Beide sind kritisch, und eines wird noch nicht überwacht: Fang dort an.", "note": "Beispielantwort, keine echten Daten.", "replay": "Erneut abspielen"}, "sections": {"install_eyebrow": "Abschnitt 01", "install_h": "Verbinde deinen Assistenten", "install_p": "Drei Schritte, kein API-Token, kein Code. Wähle den Assistenten, den du nutzt.", "prompts_eyebrow": "Abschnitt 02", "prompts_h": "Prompt-Bibliothek", "prompts_p": "48 Prompts in 8 Kategorien. Trag deinen Scope einmal ein und kopiere dann.", "pb_eyebrow": "Abschnitt 03", "tm_eyebrow": "Absch     META.forEach(function (c) {
      var cat = L.cats[c.id];
      html += '<button type="button" data-cat="' + c.id + '" style="--cc: var(--c-' + c.id + ')" aria-pressed="' + (state.cat === c.id) + '"><span class="code">' + c.code + '</span><span class="nm">' + esc(cat.name) + '</span><span class="ct">' + cat.prompts.length + "</span></button>";
    });
    html += '<div class="search"><label class="eyebrow" for="q">' + esc(L.ui.search_label) + '</label><input id="q" type="search" placeholder="' + esc(L.ui.search_placeholder) + '" value="' + esc(state.q) + '"></div>';
    index.innerHTML = html;
    document.getElementById("q").addEventListener("input", function (e) { state.q = e.target.value; buildDeck(); });
  }

  function buildDeck() {
    var q = state.q.trim().toLowerCase(), out = "";
    META.forEach(function (c) {
      if (state.cat !== "all" && state.cat !== c.id) return;
      var cat = L.cats[c.id], items = [];
      cat.prompts.forEach(function (p, i) { if (!q || (p.p + " " + p.get + " " + c.t[i].join(" ")).toLowerCase().indexOf(q) > -1) items.push(i); });
      if (!items.length) return;
      out += '<section style="--cc: var(--c-' + c.id + ')" id="cat-' + c.id + '"><div class="cat-head"><span class="code">' + c.code + " · " + items.length + " " + esc(L.ui.prompts_count) + "</span><h2>" + esc(cat.name) + "</h2><p>" + esc(cat.blurb) + '</p></div><div class="cards">';
      items.forEach(function (i) {
        var p = cat.prompts[i], isWrite = c.write && c.write.indexOf(i) > -1;
        out += '<article class="card"><p class="prompt"><span class="q" aria-hidden="true">›</span>' + render(p.p) + '</p><p class="get">' + esc(p.get) + '</p><div class="card-foot"><div class="tools">' +
          c.t[i].map(function (t) { return '<span class="tool' + (isWrite && /ack/.test(t) ? " write" : "") + '">' + t + "</span>"; }).join("") +
          '</div><button class="copy" type="button" data-copy="' + c.id + ":" + i + '">' + esc(L.ui.copy) + "</button></div></article>";
      });
      out += "</div></section>";
    });
    deck.innerHTML = out || '<p class="empty">' + esc(L.ui.empty.replace("{q}", state.q)) + "</p>";
  }

  function buildBooks() {
    books.innerHTML = L.books.map(function (b, bi) {
      return '<article class="book" style="--cc: var(--c-' + BOOK_CATS[bi] + ')"><span class="when">' + esc(b.when) + "</span><h3>" + esc(b.title) + "</h3><ol>" +
        b.steps.map(function (s) { return "<li><span><code>" + render(s[0]) + "</code><small>" + esc(s[1]) + "</small></span></li>"; }).join("") +
        '</ol><button class="copy" type="button" data-book="' + bi + '">' + esc(L.ui.copy_playbook) + "</button></article>";
    }).join("");
  }

  function renderAll() { applyStatic(); renderInstall(false); buildIndex(); buildDeck(); buildBooks(); demoFinal(); }

  function setLang(code, focus) {
    if (code === state.lang || LANGS.indexOf(code) < 0) return;
    state.lang = code; L = I18N[code]; store("pmcp-lang", code);
    renderAll(); updateLangs();
    document.getElementById("lang-live").textContent = L.name;
    if (focus) langs.querySelector('[data-lang="' + code + '"]').focus();
    if (!reduceMotion) { restart(document.getElementById("h1")); restart(document.querySelector(".cover .lede")); }
  }

  // ---------- Copy ----------
  var toast = document.getElementById("toast"), tt;
  function flash(btn, label) {
    btn.classList.add("done"); var old = btn.textContent; btn.textContent = label;
    toast.textContent = label; toast.hidden = false;
    clearTimeout(tt); tt = setTimeout(function () { toast.hidden = true; btn.classList.remove("done"); btn.textContent = old; }, 1400);
  }
  function copyText(text, btn) {
    function fallback() {
      var ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
      flash(btn, ok ? L.ui.copied : L.ui.copy_fallback);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { flash(btn, L.ui.copied); }, fallback);
    else fallback();
  }

  document.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    if (b.dataset.lang) { setLang(b.dataset.lang); return; }
    if (b.dataset.client) { setClient(b.dataset.client); return; }
    if (b.dataset.go) { document.getElementById(b.dataset.go).scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" }); return; }
    if (b.id === "replay") { playDemo(); return; }
    if (b.dataset.copytext) { copyText(b.dataset.copytext, b); return; }
    if (b.dataset.cat) { state.cat = b.dataset.cat; buildIndex(); buildDeck(); return; }
    if (b.dataset.copy) { var parts = b.dataset.copy.split(":"); copyText(fill(L.cats[parts[0]].prompts[+parts[1]].p), b); return; }
    if (b.dataset.book) {
      var bk = L.books[+b.dataset.book];
      copyText(bk.title + ". " + L.ui.playbook_header + "\n" + bk.steps.map(function (s, i) { return (i + 1) + ". " + fill(s[0]); }).join("\n"), b); return;
    }
    if (b.id === "clear") {
      vals = {}; document.querySelectorAll(".field input").forEach(function (inp) { inp.value = ""; });
      saveScope(); buildDeck(); buildBooks();
    }
  });

  function saveScope() { store("pmcp-scope", JSON.stringify(vals)); }
  document.querySelectorAll(".field input").forEach(function (inp) {
    if (vals[inp.dataset.k]) inp.value = vals[inp.dataset.k];
    inp.addEventListener("input", function () {
      var v = inp.value.trim(); if (v) vals[inp.dataset.k] = v; else delete vals[inp.dataset.k];
      saveScope(); buildDeck(); buildBooks();
    });
  });

  buildLangs(); buildClients(); buildChips(); renderAll(); updateLangs();
  requestAnimationFrame(function () { langs.classList.add("ready"); clients.classList.add("ready"); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(placeThumbs);
  if (window.ResizeObserver) { var ro = new ResizeObserver(placeThumbs); ro.observe(langs); ro.observe(clients); }
  setTimeout(playDemo, 400);
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PatrowlMCP Starter Kit</title>
<meta name="description" content="PatrowlMCP starter kit: connect Claude, ChatGPT or Codex to the Patrowl dashboard, with a library of ready-to-use prompts and playbooks.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@400;500&display=swap">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<style>
/* Layout: Patrowl charter 2026, light page. Flooded bleu-nuit cover (cover master) with a live example conversation, then five sections that each open on a flooded band in the charter's section colour cycle (01 bleu nuit, 02 violet lila, 03 orange, 04 bleu canard, 05 orange sanguine) with its giant numeral: install guide, prompt library, playbooks, tool map, field notes. Charter page furniture closes the page. */
:root {
  --band: #030563; --band-ink: #FFFFFF; --band-muted: #C9CBEA; --band-rule: #2E318A; --signature: #F98613;
  --paper: #F7F8FB;
  --surface: #FFFFFF;
  --ink: #030563;
  --body: #3D4152;
  --muted: #6E7488;
  --rule: #E4E6EE;
  --eyebrow: #E84F0D;
  --furniture: #7C52FF;
  --ph: #7C52FF;
  --ph-tint: #F3EFFF;
  --sunk: #F0F2F7;
  --ok: #2E8B6F;
  --alert: #C0392B;

  /* Section colour cycle, in charter order */
  --s1: #030563; --s2: #7C52FF; --s3: #F98613; --s4: #008D9E; --s5: #E84F0D;

  /* One charter colour per prompt category, never a severity colour */
  --c-sum: #030563; --c-rpt: #034EA2; --c-asa: #008D9E; --c-vul: #E84F0D;
  --c-cve: #7C52FF; --c-typ: #C73D0D; --c-tri: #223381; --c-rem: #2E8B6F;

  --f-display: "Archivo Black", "Arial Black", Arial, sans-serif;
  --f-body: "Proxima Nova", Arial, "Helvetica Neue", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
/* Light only: the page keeps its own colours whatever the system or app theme. */
:root, :root[data-theme="dark"] { color-scheme: light; }

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { background: var(--paper); color: var(--body); font-family: var(--f-body); font-size: 1rem; line-height: 1.6; padding: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--band); }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.inner { max-width: 74rem; margin: 0 auto; }
.wrap { max-width: 74rem; margin: 0 auto; display: grid; gap: 3rem; padding-block: 3rem 4.5rem; }
h1, h2, h3 { text-wrap: balance; margin: 0; color: var(--ink); }
p { margin: 0; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--signature); outline-offset: 2px; }
.eyebrow { font-family: var(--f-body); font-size: .75rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--eyebrow); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* ---------- Cover ---------- */
.cover { background: var(--band); color: var(--band-ink); border-bottom: 6px solid var(--signature); }
.cover .inner { padding-block: 2rem 3.5rem; display: grid; gap: 2.5rem; }
.cover-top { display: flex; flex-wrap: wrap; gap: 1rem 1.5rem; justify-content: space-between; align-items: center; }
.wordmark { font-family: var(--f-display); font-size: 1.25rem; letter-spacing: .12em; color: var(--band-ink); }
.cover-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: 3rem; align-items: center; }
.cover-text { display: grid; gap: 1.5rem; min-width: 0; }
.cover .eyebrow { color: var(--signature); }
.cover h1 { font-family: var(--f-display); font-weight: 400; text-transform: uppercase; font-size: clamp(2.3rem, 5.4vw, 4.4rem); line-height: .95; letter-spacing: .02em; color: var(--band-ink); }
.cover h1 .accent { color: var(--signature); }
.cover .lede { max-width: 58ch; font-size: 1.1rem; color: var(--band-muted); }
.cover .lede b { color: var(--band-ink); font-weight: 700; }
.ctas { display: flex; flex-wrap: wrap; gap: .75rem; }
.btn { display: inline-flex; align-items: center; gap: .5rem; min-height: 2.9rem; padding: 0 1.2rem; font-weight: 700; font-size: .95rem; cursor: pointer; border: 2px solid transparent; transition: background-color .2s, color .2s, border-color .2s; }
.btn-primary { background: var(--signature); color: var(--band); }
.btn-primary:hover { background: var(--band-ink); }
.btn-line { background: transparent; color: var(--band-ink); border-color: var(--band-muted); }
.btn-line:hover { border-color: var(--band-ink); }
.btn svg { width: 1rem; height: 1rem; flex: none; }

/* Language switch on the bleu-nuit cover */
.lang-switch { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .9rem; }
.lang-now { display: inline-flex; align-items: center; gap: .45rem; font-size: .85rem; font-weight: 700; color: var(--band-ink); }
.lang-now svg { width: 1.1rem; height: 1.1rem; flex: none; stroke: var(--signature); }
.seg { position: relative; display: flex; border: 1px solid var(--rule); background: var(--surface); }
.seg .thumb { position: absolute; top: -1px; bottom: -1px; left: 0; width: 0; background: var(--ink); box-shadow: inset 0 -3px 0 var(--signature); pointer-events: none; }
.seg.ready .thumb { transition: left .35s cubic-bezier(.3, .7, .2, 1), width .35s cubic-bezier(.3, .7, .2, 1); }
.seg button { position: relative; z-index: 1; min-height: 2.5rem; padding: 0 .9rem; background: transparent; border: 0; cursor: pointer; color: var(--muted); font-weight: 700; font-size: .9rem; transition: color .25s; }
.seg button + button { border-left: 1px solid var(--rule); }
.seg button:hover { color: var(--ink); }
.seg button[aria-checked="true"], .seg button[aria-selected="true"] { color: var(--surface); }
.seg button:focus-visible { z-index: 2; }
.cover .seg { background: transparent; border-color: var(--band-rule); }
.cover .seg button { min-width: 2.75rem; padding: 0 .7rem; font-family: var(--f-mono); font-weight: 500; font-size: .78rem; letter-spacing: .06em; color: var(--band-muted); }
.cover .seg button + button { border-left-color: var(--band-rule); }
.cover .seg button:hover { color: var(--band-ink); }
.cover .seg .thumb { background: var(--signature); box-shadow: none; }
.cover .seg button[aria-checked="true"] { color: var(--band); }

/* Example conversation */
.demo { background: var(--surface); color: var(--body); border-left: 6px solid var(--signature); padding: 1.4rem 1.5rem 1.2rem; display: grid; gap: 1rem; min-width: 0; box-shadow: 0 24px 48px -24px rgba(0, 0, 0, .45); }
.demo-head { display: flex; justify-content: space-between; align-items: center; gap: .75rem; }
.demo-tag { font-size: .68rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--eyebrow); }
.demo-replay { display: inline-flex; align-items: center; gap: .35rem; background: transparent; border: 1px solid var(--rule); padding: .3rem .6rem; font-size: .75rem; font-weight: 700; color: var(--ink); cursor: pointer; }
.demo-replay:hover { border-color: var(--ink); }
.demo-replay svg { width: .85rem; height: .85rem; }
.msg { display: grid; gap: .35rem; }
.who { font-size: .68rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.ask { font-family: var(--f-mono); font-size: .9rem; line-height: 1.55; color: var(--ink); background: var(--sunk); padding: .75rem .9rem; min-height: 3.2em; overflow-wrap: anywhere; }
.caret { display: inline-block; width: .55em; height: 1.05em; margin-left: 1px; vertical-align: -.15em; background: var(--signature); animation: blink 1s steps(1) infinite; }
.caret[hidden] { display: none; }
@keyframes blink { 50% { opacity: 0; } }
.reading { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem; font-size: .78rem; color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: .3rem; font-family: var(--f-mono); font-size: .72rem; padding: .15rem .45rem; border: 1px solid var(--rule); color: var(--muted); transition: background-color .3s, color .3s, border-color .3s, opacity .3s; }
.chip svg { width: .8rem; height: .8rem; flex: none; }
.chip.wait { opacity: .35; }
.chip.wait svg, .chip.run svg { display: none; }
.chip.run { border-color: var(--signature); color: var(--ink); box-shadow: 0 0 0 3px rgba(249, 134, 19, .18); }
.chip.done { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.answer { font-size: .98rem; line-height: 1.55; color: var(--ink); font-weight: 700; transition: opacity .5s, transform .5s; }
.answer.hide { opacity: 0; transform: translateY(6px); }
.demo-note { font-size: .74rem; color: var(--muted); }

/* ---------- Section bands (section divider master) ---------- */
.band { background: var(--sc); color: var(--sct); }
.band .inner { padding-block: 2.25rem 2rem; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1.5rem; align-items: end; }
.band-text { display: grid; gap: .6rem; min-width: 0; }
.band .eyebrow { color: var(--sct); opacity: .8; }
.band h2 { font-family: var(--f-display); font-weight: 400; text-transform: uppercase; font-size: clamp(1.7rem, 3.6vw, 2.8rem); line-height: 1; letter-spacing: .02em; color: var(--sct); }
.band p { max-width: 62ch; color: var(--sct); opacity: .9; }
.band .num { font-family: var(--f-display); font-size: clamp(4rem, 11vw, 8.5rem); line-height: .8; color: var(--sct); opacity: .3; }
.b1 { --sc: var(--s1); --sct: #FFFFFF; } .b2 { --sc: var(--s2); --sct: #FFFFFF; } .b3 { --sc: var(--s3); --sct: #030563; }
.b4 { --sc: var(--s4); --sct: #FFFFFF; } .b5 { --sc: var(--s5); --sct: #FFFFFF; }

/* ---------- Install guide ---------- */
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.25rem; }
.fact { display: grid; gap: .35rem; padding-top: .9rem; border-top: 4px solid var(--s1); align-content: start; }
.fact h3 { font-size: 1.05rem; font-weight: 700; }
.fact p { font-size: .92rem; color: var(--muted); }
.picker { display: grid; gap: 1rem; }
.picker-row { display: flex; flex-wrap: wrap; gap: .75rem 1.25rem; align-items: center; }
.picker-row .eyebrow { color: var(--ink); }
.works { font-size: .88rem; color: var(--muted); }
.works b { color: var(--ink); }
.callout { border-left: 4px solid var(--eyebrow); background: var(--surface); padding: .8rem 1rem; font-size: .9rem; color: var(--body); }
.callout.req { border-left-color: var(--eyebrow); }
.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); counter-reset: none; }
.step { background: var(--surface); padding: 1.3rem 1.3rem 1.2rem; display: grid; gap: .7rem; align-content: start; min-width: 0; }
.step-num { display: flex; align-items: baseline; gap: .6rem; }
.step-num b { font-family: var(--f-display); font-weight: 400; font-size: 2.2rem; line-height: .9; color: var(--s1); }
.step-num span { font-size: .7rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--eyebrow); }
.step h3 { font-size: 1.12rem; font-weight: 700; }
.step p { font-size: .92rem; }
.step .note { font-size: .82rem; color: var(--muted); }
.cmd { display: flex; align-items: stretch; border: 1px solid var(--ink); min-width: 0; }
.cmd code { flex: 1; min-width: 0; padding: .6rem .7rem; font-family: var(--f-mono); font-size: .8rem; line-height: 1.5; color: var(--surface); background: var(--ink); overflow-wrap: anywhere; }
.cmd .lbl { display: block; font-family: var(--f-body); font-size: .62rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--band-muted); margin-bottom: .15rem; }
.cmd button { flex: none; border: 0; background: var(--signature); color: var(--band); font-weight: 700; font-size: .78rem; padding: 0 .8rem; cursor: pointer; }
.cmd button:hover { background: var(--ink); color: var(--surface); box-shadow: inset 0 0 0 2px var(--signature); }
.cmd button.done { background: var(--ok); color: var(--surface); }
.after { font-size: .88rem; color: var(--muted); }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.step.swap { animation: rise .45s cubic-bezier(.2, .7, .2, 1) both; }
.step.swap:nth-child(2) { animation-delay: .07s; } .step.swap:nth-child(3) { animation-delay: .14s; }

/* ---------- Prompt library ---------- */
.anatomy { background: var(--surface); border: 1px solid var(--rule); border-left: 6px solid var(--signature); padding: 1.5rem; display: grid; gap: 1rem; }
.anatomy-line { display: flex; flex-wrap: wrap; gap: .9rem .4rem; font-family: var(--f-mono); font-size: clamp(.92rem, 1.6vw, 1.08rem); line-height: 1.4; color: var(--ink); }
.part { display: inline-grid; gap: .3rem; }
.part > span:first-child { padding-bottom: .25rem; border-bottom: 3px solid var(--pc); }
.part > span:last-child { font-family: var(--f-body); font-size: .7rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--pc); }
.anatomy p { font-size: .92rem; color: var(--muted); max-width: 70ch; }
.scope { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1.5px solid var(--furniture); padding-block: .85rem; display: grid; gap: .6rem; }
.scope-row { display: flex; flex-wrap: wrap; gap: .5rem .75rem; align-items: end; }
.field { display: grid; gap: .2rem; flex: 1 1 9rem; min-width: 0; }
.field label { font-family: var(--f-mono); font-size: .7rem; color: var(--ph); letter-spacing: .04em; }
.field input { width: 100%; padding: .45rem .6rem; border: 1px solid var(--rule); background: var(--surface); color: var(--ink); font-family: var(--f-mono); font-size: .85rem; border-radius: 0; }
.field input:focus { border-color: var(--ph); outline: none; box-shadow: 0 0 0 2px var(--ph-tint); }
.scope-note { font-size: .8rem; color: var(--muted); }
.btn-ghost { border: 1px solid var(--rule); background: transparent; padding: .45rem .8rem; cursor: pointer; font-size: .82rem; font-weight: 700; color: var(--ink); }
.btn-ghost:hover { border-color: var(--ink); }
.lib { display: grid; grid-template-columns: 14rem minmax(0, 1fr); gap: 2.5rem; align-items: start; }
.index { position: sticky; top: 7.5rem; display: grid; gap: .15rem; }
.index button { display: grid; grid-template-columns: 2.9rem minmax(0, 1fr) auto; gap: .5rem; align-items: baseline; text-align: left; padding: .5rem .6rem; border: 0; background: transparent; cursor: pointer; border-left: 4px solid transparent; color: var(--ink); }
.index button:hover { background: var(--surface); }
.index button[aria-pressed="true"] { background: var(--surface); border-left-color: var(--cc, var(--signature)); }
.index .code { font-family: var(--f-mono); font-size: .72rem; font-weight: 500; color: var(--cc, var(--ink)); }
.index .nm { font-size: .9rem; font-weight: 700; }
.index .ct { font-family: var(--f-mono); font-size: .72rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.search { margin-top: .75rem; display: grid; gap: .3rem; }
.search input { width: 100%; padding: .5rem .6rem; border: 1px solid var(--rule); background: var(--surface); color: var(--ink); font-size: .88rem; border-radius: 0; }
.deck { display: grid; gap: 2.75rem; min-width: 0; }
.cat-head { display: grid; gap: .35rem; margin-bottom: 1rem; padding-bottom: .75rem; border-bottom: 3px solid var(--cc); }
.cat-head .code { font-family: var(--f-mono); font-size: .78rem; color: var(--cc); font-weight: 500; }
.cat-head h2 { font-family: var(--f-body); font-size: 1.6rem; font-weight: 700; line-height: 1.24; }
.cat-head p { color: var(--muted); font-size: .95rem; max-width: 64ch; }
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); }
.card { background: var(--surface); padding: 1.15rem 1.2rem 1rem; display: grid; gap: .75rem; align-content: start; min-width: 0; }
.prompt { font-family: var(--f-mono); font-size: .88rem; line-height: 1.6; overflow-wrap: anywhere; color: var(--ink); }
.prompt .q { color: var(--cc); user-select: none; margin-right: .35rem; font-weight: 500; }
.ph { color: var(--ph); background: var(--ph-tint); padding: 0 .2rem; }
.get { font-size: .88rem; color: var(--muted); }
.card-foot { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; justify-content: space-between; margin-top: auto; }
.tools { display: flex; flex-wrap: wrap; gap: .3rem; min-width: 0; }
.tool { font-family: var(--f-mono); font-size: .68rem; padding: .1rem .35rem; border: 1px solid var(--rule); color: var(--muted); }
.tool.write { border-color: var(--alert); color: var(--alert); }
.copy { border: 1px solid var(--ink); background: var(--ink); color: var(--surface); padding: .3rem .75rem; font-size: .78rem; font-weight: 700; letter-spacing: .04em; cursor: pointer; }
.copy:hover { background: var(--signature); border-color: var(--signature); color: var(--band); }
.copy.done { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.empty { padding: 2rem; border: 1px dashed var(--rule); color: var(--muted); }

/* Playbooks, tool map, field notes */
.books { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.25rem; }
.book { background: var(--surface); border: 1px solid var(--rule); border-top: 5px solid var(--cc); padding: 1.25rem; display: grid; gap: .9rem; align-content: start; min-width: 0; }
.book h3 { font-size: 1.15rem; font-weight: 700; }
.book .when { font-family: var(--f-mono); font-size: .72rem; color: var(--cc); }
.book ol { margin: 0; padding: 0; list-style: none; display: grid; gap: .6rem; counter-reset: s; }
.book li { display: grid; grid-template-columns: 1.6rem minmax(0, 1fr); gap: .5rem; font-size: .88rem; counter-increment: s; }
.book li::before { content: counter(s, decimal-leading-zero); font-family: var(--f-display); font-size: .78rem; color: var(--cc); padding-top: .1rem; }
.book li code { font-family: var(--f-mono); font-size: .8rem; display: block; color: var(--ink); overflow-wrap: anywhere; }
.book li small { color: var(--muted); font-size: .8rem; }
.book .copy { justify-self: start; }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--rule); background: var(--surface); }
table { width: 100%; border-collapse: collapse; font-size: .88rem; min-width: 40rem; }
th { text-align: left; font-size: .7rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--eyebrow); padding: .75rem .9rem; border-bottom: 2px solid var(--ink); }
td { padding: .65rem .9rem; border-bottom: 1px solid var(--rule); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td:first-child { font-family: var(--f-mono); font-size: .8rem; white-space: nowrap; color: var(--ink); }
td.k { font-family: var(--f-mono); font-size: .75rem; color: var(--muted); }
.scope-tag { font-family: var(--f-mono); font-size: .68rem; padding: .05rem .35rem; border: 1px solid var(--rule); color: var(--muted); white-space: nowrap; }
.scope-tag.def { border-color: var(--eyebrow); color: var(--eyebrow); }
.notes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 1.5rem; border-top: 3px solid var(--ink); }
.note-card { padding: 1.25rem 0; display: grid; gap: .4rem; align-content: start; border-bottom: 1px solid var(--rule); }
.note-card h3 { font-size: 1rem; font-weight: 700; }
.note-card p { font-size: .9rem; color: var(--muted); }
.note-card p code { font-family: var(--f-mono); font-size: .8rem; color: var(--ink); }

footer .inner { display: grid; gap: 1.5rem; padding-block: 0 4rem; }
footer .legend { font-size: .82rem; color: var(--muted); max-width: 80ch; }
.furniture { display: grid; grid-template-columns: 1fr auto 1fr; gap: 1rem; align-items: baseline; border-top: 1.5px solid var(--furniture); padding-top: .75rem; font-size: .78rem; color: var(--muted); }
.furniture .wm { font-family: var(--f-display); letter-spacing: .12em; color: var(--ink); }
.furniture .conf { justify-self: end; text-align: right; }
.toast { position: fixed; left: 50%; bottom: calc(1.25rem + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: .5rem 1rem; font-size: .85rem; font-weight: 700; z-index: 10; }

@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.cover h1.swap { animation: rise .5s cubic-bezier(.2, .7, .2, 1) both; }
.cover .lede.swap { animation: fade .4s ease-out .08s both; }

@media (max-width: 960px) {
  .cover-grid { grid-template-columns: minmax(0, 1fr); gap: 2rem; }
  .steps { grid-template-columns: minmax(0, 1fr); }
  .lib { grid-template-columns: minmax(0, 1fr); gap: 1.5rem; }
  .index { position: static; display: flex; overflow-x: auto; gap: .25rem; padding-bottom: .25rem; }

."}, {"p": "Trace une chronologie des dates d'enregistrement de chaque domaine sosie de {domain} et mets en évidence les plus récents.", "get": "Un visuel qui montre si le typosquatting augmente."}]}, "tri": {"name": "Tri des actifs", "blurb": "Décidez quoi surveiller, quoi vous approprier et quoi abandonner.", "prompts": [{"p": "Trie les actifs de {org} marqués new : garder, surveiller ou ignorer, avec une raison en une ligne pour chacun.", "get": "Une décision par actif, applicable dans le dashboard."}, {"p": "Quels actifs non protégés de {org} devons-nous surveiller en priorité, compte tenu des crédits EASM restants sur le tenant {tenant} ?", "get": "Une short-list de surveillance qui tient dans le budget."}, {"p": "Liste les actifs de criticité élevée de {org} sans propriétaire.", "get": "Les lacunes de responsabilité les plus importantes."}, {"p": "Quels actifs surveillés de {org} sont injoignables ? Devons-nous continuer à payer pour les surveiller ?", "get": "Des crédits que vous pouvez récupérer."}, {"p": "Propose un niveau de criticité pour chaque nouvel actif de {org} en fonction de son nom, de ses services exposés et de ses technologies.", "get": "Une criticité proposée, avec le raisonnement."}, {"p": "Trouve les actifs de {org} dont le nom semble généré automatiquement, comme supportf01 ou test-test, et qui sont injoignables. Pouvons-nous les supprimer ?", "get": "Du bruit d'inventaire à nettoyer."}]}, "rem": {"name": "Plan de remédiation", "blurb": "Transformez les findings en travail ordonné, avec des responsables et des preuves de correction.", "prompts": [{"p": "Construis un plan de remédiation à 30 jours pour {org} : étapes ordonnées, rôle du responsable, effort, et les findings que chaque étape clôture.", "get": "Un plan que vous pouvez présenter et suivre."}, {"p": "Quels changements uniques clôtureraient le plus de findings à la fois sur {org} ?", "get": "Des correctifs à fort effet de levier, comme une règle de pare-feu ou un certificat."}, {"p": "Transforme les 10 principaux findings de {org} en tickets : titre, actif, correctif, test d'acceptation. Crée-les dans Linear.", "get": "Des tickets dans votre outil de suivi, prêts à être assignés."}, {"p": "Après les correctifs, liste ce qu'il faut retester sur {org} et vérifie combien de crédits de retest il reste au tenant {tenant}.", "get": "Un plan de retest qui tient dans les crédits."}, {"p": "Acquitte toutes les alertes de niveau Information de {org} datant de plus de 30 jours. Montre-moi la liste avant d'agir.", "get": "Une file d'alertes plus propre, après votre confirmation."}, {"p": "Rédige l'état de la remédiation de {org} sous forme de point d'une page : terminé, en cours, bloqué, et ce dont nous avons besoin de la part du client.", "get": "Un point d'avancement pour le call hebdomadaire."}]}}, "books": [{"title": "Briefing du lundi", "when": "Hebdomadaire · 5 minutes", "steps": [["Utilise le tenant {tenant}.", "Définit le périmètre de la conversation."], ["Qu'est-ce qui a changé sur {org} au cours des 7 derniers jours ?", "Nouveaux actifs, findings et domaines sosies."], ["Liste les vulnérabilités en retard et celles qui arrivent à échéance cette semaine.", "Les échéances qui comptent."], ["Donne-moi trois priorités pour cette semaine, une ligne chacune.", "Le plan de la semaine."]]}, {"title": "Tri des nouveaux actifs", "when": "Après chaque vague de découverte", "steps": [["Liste les derniers actifs trouvés par Patrowl pour {org}, du plus récent au plus ancien.", "Ce que la découverte a ajouté."], ["Signale les noms sensibles et vérifie lesquels sont actifs.", "Sépare les vrais hôtes du bruit."], ["Recommande lesquels surveiller dans la limite des crédits EASM restants.", "Tient dans le budget."], ["Propose une criticité et un rôle de responsable pour chaque actif conservé.", "Prêt à appliquer."]]}, {"title": "Exercice d'urgence CVE", "when": "Quand une CVE fait l'actualité", "steps": [["Explique {cve} en cinq lignes.", "D'abord une compréhension commune."], ["Quels actifs de {org} sont affectés ou font tourner le produit vulnérable ?", "Votre exposition réelle."], ["Certains d'entre eux sont-ils exposés sur Internet et non surveillés ?", "Le sous-ensemble urgent."], ["Rédige le bulletin et crée des tickets pour chaque actif affecté.", "De l'action, pas seulement de la sensibilisation."]]}, {"title": "Takedown des domaines sosies", "when": "Mensuel", "steps": [["Liste les domaines sosies de {org}, dédoublonnés.", "Supprime les répétitions par domaine."], ["Retire ceux qui nous appartiennent ou qui sont des homonymes de longue date.", "Réduit les faux positifs."], ["Classe les autres selon les MX, le site actif et la date d'enregistrement.", "Potentiel de phishing."], ["Construis la file de takedown avec les preuves.", "Prêt pour le prestataire."]]}, {"title": "Remédiation à 30 jours", "when": "Après un audit", "steps": [["Regroupe les findings ouverts de {org} par cause racine.", "Moins de correctifs, mais plus importants."], ["Ordonne les correctifs selon le risque supprimé par heure d'effort.", "Le meilleur retour d'abord."], ["Transforme chaque étape en ticket avec un test d'acceptation.", "Du travail traçable."], ["Liste ce qu'il faut retester une fois chaque étape livrée.", "La preuve que c'est corrigé."]]}, {"title": "Briefing exécutif", "when": "Mensuel ou trimestriel", "steps": [["Génère une synthèse exécutive de la surface d'attaque et des principaux risques de {org}.", "Le récit."], ["Vérifie les chiffres : dédoublonne et indique les données utilisées.", "Un rapport que vous pouvez défendre."], ["Rends-la sous forme de page HTML avec une liste de risques classés et un plan à 30 jours.", "De quoi partager."], ["Rédige l'e-mail d'accompagnement pour le client.", "Envoyé le jour même."]]}], "tools": ["Les clients et organisations que vous pouvez voir", "Crédits EASM, créneaux de pentest et crédits de retest consommés et restants", "Taille de la surface, ce qui est actif, couverture de surveillance, croissance sur N jours", "Inventaire, découvertes les plus récentes, actifs non surveillés ou injoignables", "Sous-domaines trouvés par l'EASM sous un domaine", "Éditeurs, produits et versions observés sur le périmètre", "Findings ouverts, en retard et bientôt échus, avec recommandations de correction", "Totaux par sévérité, critiques ouvertes, alertes non acquittées", "Findings critiques ouverts (new, ack ou assigned)", "Services exposés, certificats, TLS, sécurité de la messagerie", "CVE sur vos actifs, avec indicateurs CISA KEV et exploit connu", "Vérifications Patrowl des menaces récemment publiées, et si vos actifs en ressortent impactés", "Domaines sosies avec registrar, MX, web et statut de parking", "Ce qui s'est déclenché et ce que personne n'a regardé", "Acquitter des alertes. Modifie les données ; Claude demande d'abord", "Quels correctifs ont été vérifiés et lesquels ont échoué", "Une synthèse de posture markdown prête à l'emploi"], "notes": [{"h": "Nommez le périmètre une fois", "p": "Dites « utilise le tenant Acme » au début. Claude résout le tenant en ses organisations et conserve ce périmètre pour le reste de la conversation."}, {"h": "Attention aux outils sur l'org. par défaut", "p": "Les vulnérabilités, alertes, retests et la posture sont lus sur votre organisation par défaut. Si vous en gérez plusieurs, demandez à Claude de confirmer quelle organisation il a lue, ou d'interroger les vulnérabilités actif par actif."}, {"h": "Comptez avant de lister", "p": "Sur les gros tenants, demandez d'abord des statistiques, puis explorez une tranche. Les extractions d'inventaire complètes peuvent s'arrêter vers 8 000 enregistrements ; une date <code>since</code> ou un filtre <code>protection</code> les garde légères."}, {"h": "Demandez le dédoublonnage", "p": "Les résultats paginés peuvent répéter des lignes, et les détections de domaines sosies se répètent une fois par domaine protégé. Demandez à Claude de compter les éléments uniques avant d'annoncer un chiffre."}, {"h": "Demandez ce qui a été lu", "p": "Terminez les prompts de reporting par « indique les données utilisées et ce que tu n'as pas couvert ». Le rapport porte alors ses propres limites, ce qui compte quand il part chez un client."}, {"h": "Le MCP est en lecture seule", "p": "Il lit vos données Patrowl pour répondre à vos questions et ne peut rien créer, modifier ni supprimer dans votre compte."}], "x": {"cta_install": "Installer en 3 étapes", "cta_prompts": "Parcourir les 48 prompts", "demo": {"label": "Exemple", "you": "Vous", "assistant": "Claude + Patrowl", "prompt": "Sommes-nous affectés par CVE-2024-3400 ? Vérifie d'abord le résultat trending attack de Patrowl pour Acme Corp.", "reading": "Lecture de Patrowl", "answer": "Oui. 2 actifs exposés sur Internet d'Acme Corp font tourner la version vulnérable. Les deux sont critiques et l'un d'eux n'est pas encore surveillé : commencez par celui-là.", "note": "Réponse illustrative, pas de données réelles.", "replay": "Rejouer"}, "sections": {"install_eyebrow": "Section 01", "install_h": "Connectez votre assistant", "install_p": "Trois étapes, sans token d'API, sans code. Choisissez l'assistant que vous utilisez.", "prompts_eyebrow": "Section 02", "prompts_h": "Bibliothèque de prompts", "prompts_p": "48 prompts en 8 catégories. Renseignez votre périmètre une fois, puis copiez.", "pb_eyebrow": "Section 03", "tm_eyebrow": "Section 04", "fn_eyebrow": "Section 05"}, "install": {"before_h": "Avant de commencer", "f1_h": "Aucun token d'API", "f1_p": "Vous vous connectez une fois avec votre compte Patrowl Dashboard, dans votre navigateur.", "f2_h": "Vos droits s'appliquent", "f2_p": "L'assistant ne voit que les données auxquelles votre compte Patrowl a accès.", "f3_h": "Sessions", "f3_p": "Une session prend fin après 8 heures d'inactivité, ou 7 jours après votre connexion. Connectez-vous alors à nouveau.", "pick": "Votre assistant", "works_in": "Fonctionne dans", "step": "Étape", "copy": "Copier", "url_label": "URL du serveur", "claude": {"tab": "Claude", "works": "claude.ai, Claude Desktop, mobile et Claude Code", "s1_h": "Ajoutez le connecteur", "s1_p": "Dans claude.ai ou Claude Desktop, ouvrez Settings → Connectors → Add custom connector. Nommez-le Patrowl, collez l'URL du serveur et laissez vides les champs OAuth Client ID et Secret. Cliquez sur Add.", "s1_note": "Votre administrateur a déjà ajouté Patrowl pour tout le monde ? Passez à l'étape 2.", "s2_h": "Connectez-vous", "s2_p": "Cliquez sur Connect à côté de Patrowl, validez la page de consentement et connectez-vous avec votre compte Patrowl Dashboard. Le connecteur affiche Connected.", "s3_h": "Posez vos questions", "s3_p": "Dans une nouvelle conversation, ouvrez le menu + et vérifiez que Patrowl est activé. Le connecteur suit votre compte Claude : il fonctionne aussi sur mobile et dans Claude Code."}, "code": {"tab": "Claude Code", "works": "Claude Code dans le terminal et l'onglet Code de Claude Desktop", "s1_h": "Ajoutez le serveur", "s1_p": "Ouvrez un terminal (Terminal sur macOS, PowerShell sur Windows) et exécutez cette commande. --scope user rend Patrowl disponible dans tous les dossiers.", "s2_h": "Connectez-vous", "s2_p": "Lancez claude, tapez /mcp, sélectionnez patrowl, puis Authenticate. Validez la page de consentement et connectez-vous avec votre compte Patrowl Dashboard. Le terminal affiche Authentication successful.", "s3_h": "Posez vos questions", "s3_p": "Posez vos questions dans n'importe quelle session Claude Code. Dans Claude Desktop, ouvrez l'onglet Code et démarrez une session Local."}, "claude_warn": "Choisissez le connecteur Claude ou Claude Code, pas les deux : avec les deux, Claude charge chaque outil Patrowl en double.", "chatgpt": {"tab": "ChatGPT", "works": "chatgpt.com, sur le web", "req": "Nécessite un abonnement ChatGPT Business, Enterprise ou Edu. L'administrateur de votre espace de travail devra peut-être d'abord autoriser les applications personnalisées (Developer mode).", "s1_h": "Ajoutez l'application", "s1_p": "Sur chatgpt.com, ouvrez Settings → Apps et cliquez sur Create. Si on vous le demande, activez Developer mode. Nommez-la Patrowl, collez l'URL du serveur, choisissez OAuth et laissez vides les champs Client ID et Secret. Acceptez l'avertissement, puis cliquez sur Create.", "s1_note": "Votre administrateur a déjà publié Patrowl pour l'espace de travail ? Passez à l'étape 2.", "s2_h": "Connectez-vous", "s2_p": "Cliquez sur Connect dans l'application Patrowl, validez la page de consentement et connectez-vous avec votre compte Patrowl Dashboard. L'application affiche Connected.", "s3_h": "Posez vos questions", "s3_p": "Dans une conversation, cliquez sur + à côté de la zone de message, puis sur More, et sélectionnez Patrowl. ChatGPT n'utilise Patrowl que lorsque l'application est sélectionnée."}, "codex": {"tab": "Codex", "works": "Codex CLI et l'application de bureau Codex", "s1_h": "Ajoutez le serveur", "s1_p": "Dans un terminal, exécutez cette commande. Elle enregistre Patrowl dans ~/.codex/config.toml pour tous les dossiers.", "s2_h": "Connectez-vous", "s2_p": "Exécutez cette commande. Votre navigateur s'ouvre : validez la page de consentement et connectez-vous avec votre compte Patrowl Dashboard.", "s3_h": "Posez vos questions", "s3_p": "Exécutez codex mcp list pour vérifier que patrowl apparaît dans la liste, puis posez vos questions. Dans l'application de bureau, vérifiez Settings → MCP servers."}, "expired": "Session expirée ? Reconnectez-vous de la même façon qu'à l'étape 2."}}}, "en": {"lang": "en", "name": "English", "ui": {"eyebrow": "PatrowlMCP · prompt book · 48 prompts, 6 playbooks", "h1_main": "Ask your attack surface", "h1_accent": "anything.", "lede_before": "PatrowlMCP connects Claude to the Patrowl dashboard. You ask in plain language; Claude reads your", "lede_bold": "assets, vulnerabilities, risk insights, CVEs and lookalike domains", "lede_after": ", then writes the summary, the report or the remediation plan. These are prompts that work, grouped by the job you're doing.", "lang_label": "Language", "scope_aria": "Fill in your scope", "eg": "e.g.", "clear": "Clear", "scope_note": "Fill these once. Every prompt and playbook on the page updates, and Copy puts the filled-in text on your clipboard. Values stay in this browser only.", "categories_aria": "Categories", "library_aria": "Prompt library", "all_code": "ALL", "all_name": "Every prompt", "search_label": "Search prompts", "search_placeholder": "e.g. overdue, MX, credits", "prompts_count": "prompts", "copy": "Copy", "copy_playbook": "Copy playbook", "copied": "Copied", "copy_fallback": "Select and copy manually", "playbook_header": "Run these steps in order and keep the scope between steps:", "empty": "No prompt matches \"{q}\". Try a broader word such as assets, CVE or report.", "pb_eyebrow": "Playbooks", "pb_h": "Chain prompts into a routine", "pb_p": "Each playbook is a sequence you run in one conversation. Claude keeps the scope and the earlier answers, so later steps build on what it already read. Copy the whole playbook to paste it as a single request.", "tm_eyebrow": "Tool map", "tm_h": "What Claude calls behind each question", "tm_p": "You never call tools yourself. This map helps you phrase questions the tools can answer, and shows which ones need you to name the organization.", "th_tool": "Tool", "th_answers": "Answers", "th_filters": "Useful filters", "th_scope": "Scope", "scope_all_visible": "all visible", "scope_tenant": "tenant", "scope_domain_asset": "domain asset", "scope_default_org": "default org", "fn_eyebrow": "Field notes", "fn_h": "Get answers you can trust", "legend": "Prompts use placeholders in braces. Status names follow the dashboard: vulnerabilities use new, ack, assigned, patched, closed and closed-risk-acceptance; risk insights use new, acknowledged, fixed, reopened, benign and risk_acceptance.", "date": "NOVEMBER 2026"}, "anatomy": {"aria": "Anatomy of a good prompt", "eyebrow": "Anatomy of a prompt that gets a precise answer", "action": "List the newest assets", "action_label": "Action", "scope": "for Acme Corp", "scope_label": "Scope", "window": "discovered since 2026-10-01", "window_label": "Window", "filter": "that aren't monitored,", "filter_label": "Filter", "output": "as a table with a keep / monitor / ignore verdict.", "output_label": "Output", "p": "Scope tells Claude which tenant or organization to read. A window and a filter keep large inventories inside tool limits. Naming the output shape gets you a table, a ranked list or a page instead of a wall of text."}, "placeholders": {"tenant": "Acme Group", "org": "Acme Corp", "domain": "acme.com", "cve": "CVE-2024-3400", "technology": "Fortinet FortiOS", "date": "2026-10-01"}, "cats": {"sum": {"name": "Summaries", "blurb": "Fast reads of where you stand. Use them to open a meeting or a week.", "prompts": [{"p": "Give me the security posture of {org} in one paragraph: open vulnerabilities by severity, unacknowledged alerts, and the single thing to fix first.", "get": "A five-line status with one clear priority."}, {"p": "What changed on {org} since {date}? New assets, new vulnerabilities, new risk insights and new lookalike domains, newest first.", "get": "A change log grouped by type, with counts at the top."}, {"p": "Summarize every organization in tenant {tenant} in one table: asset count, monitoring coverage, open criticals and overdue findings.", "get": "A portfolio view for MSSP or group security teams."}, {"p": "Explain the top 3 risks of {org} to a CFO in under 150 words. No jargon, one sentence each on business impact.", "get": "Plain-language risk statements ready for a board slide."}, {"p": "Generate the security summary for {org} since {date} and highlight anything that got worse.", "get": "The built-in markdown summary with regressions called out."}, {"p": "Which organizations in tenant {tenant} need attention this week, and why? Rank them.", "get": "A short ranked list with one reason per organization."}]}, "rpt": {"name": "Reporting", "blurb": "Documents and pages you hand to someone else. Ask for the format you need.", "prompts": [{"p": "Build an executive briefing page for {org}: attack surface at a glance, seven ranked risks with evidence, and a 30-day plan. Render it as an HTML page.", "get": "A shareable page with figures, charts and a plan."}, {"p": "Produce the monthly KPI table for {org}: new assets, vulnerabilities opened vs closed, overdue count, coverage rate, and the trend versus last month.", "get": "A metrics table for a monthly service review."}, {"p": "Draft a client email for {org} summarizing this week's high and critical findings and the decisions we need from them.", "get": "A ready-to-send email with a clear ask."}, {"p": "List five wins and five open issues for {org} for the quarterly review, each with the evidence behind it.", "get": "Balanced talking points for a QBR."}, {"p": "Write an audit-ready statement of external exposure for {org}: scope, method, coverage, open findings, accepted risks. State what data you used and what you didn't cover.", "get": "Evidence for ISO 27001, NIS2 or DORA reviews."}, {"p": "Compare monitoring coverage and open criticals across all organizations of tenant {tenant} and chart it.", "get": "A side-by-side chart for group-level reporting."}]}, "asa": {"name": "Attack surface", "blurb": "Map what is exposed, what is new, and what nobody is watching.", "prompts": [{"p": "Map the attack surface of {org}: top domains, subdomains and IPs, how many are up, and monitoring coverage by criticality.", "get": "The surface in numbers, with gaps by criticality."}, {"p": "List the latest assets Patrowl discovered for {org} and flag the ones whose names suggest something sensitive: admin, vpn, dev, test, api, backup, vault.", "get": "New discoveries with sensitive ones marked."}, {"p": "Which services are exposed on {org}? Group databases, remote access, mail and file transfer separately, with host and port.", "get": "An exposed-services inventory by family."}, {"p": "What technologies run on the perimeter of {org}, and which versions look outdated?", "get": "A stack inventory with aging versions flagged."}, {"p": "Which IPs in scope for {org} belong to CDNs or SaaS providers and shouldn't use EASM credits?", "get": "A cleanup list that frees credits."}, {"p": "Show the subdomains of {domain} that are down but still in DNS. Which could be taken over?", "get": "Subdomain takeover candidates to verify."}]}, "vul": {"name": "Vulnerabilities & risk", "blurb": "Work the findings list by deadline, impact and effort.", "prompts": [{"p": "List overdue vulnerabilities for {org}, sorted by severity, with the asset, days past SLA and the fix.", "get": "The SLA breach list, worst first."}, {"p": "Which vulnerabilities on {org} are due in the next 14 days?", "get": "A deadline view for the coming sprint."}, {"p": "Find quick wins on {org}: high or critical severity with low fix effort.", "get": "The fixes with the best return."}, {"p": "Show high and critical risk insights on {org} that were marked benign or risk-accepted, and challenge each decision.", "get": "A second look at accepted risk."}, {"p": "Group the open findings of {org} by root cause: certificates, TLS, exposed services, outdated software, mail security.", "get": "Themes you can fix with one change each."}, {"p": "Which retests ran on {org} since {date}, and which fixes failed?", "get": "A verification status board."}]}, "cve": {"name": "CVE response", "blurb": "From a headline CVE to an answer about your own assets in minutes.", "prompts": [{"p": "Are we affected by {cve}? Check the Patrowl trending-attack result for {org} first, then list impacted assets with criticality, exposure and monitoring status.", "get": "A yes or no with the asset list to prove it."}, {"p": "Which trending attacks did Patrowl check on {org} since {date}, and which came out impacted or potentially impacted?", "get": "New threats already tested n per asset you can apply in the dashboard."}, {"p": "Which unprotected assets of {org} should we monitor first, given the EASM credits left on tenant {tenant}?", "get": "A monitoring shortlist that fits the budget."}, {"p": "List high-criticality assets of {org} with no owner.", "get": "The accountability gaps that matter most."}, {"p": "Which monitored assets of {org} are down? Should we keep paying to monitor them?", "get": "Credits you can reclaim."}, {"p": "Suggest a criticality level for each new asset of {org} based on its name, exposed services and technologies.", "get": "Proposed criticality with the reasoning."}, {"p": "Find assets of {org} whose names look generated, like supportf01 or test-test, that are down. Can we prune them?", "get": "Inventory noise to clean up."}]}, "rem": {"name": "Remediation plan", "blurb": "Turn findings into ordered work with owners and proof of fix.", "prompts": [{"p": "Build a 30-day remediation plan for {org}: ordered steps, owner role, effort, and which findings each step closes.", "get": "A plan you can present and track."}, {"p": "Which single changes would close the most findings on {org} at once?", "get": "High-leverage fixes, such as one firewall rule or one certificate."}, {"p": "Turn the top 10 findings of {org} into tickets: title, asset, fix, acceptance test. Create them in Linear.", "get": "Tickets in your tracker, ready to assign."}, {"p": "After the fixes, list what to retest on {org} and check how many retest credits tenant {tenant} has left.", "get": "A retest plan that fits the credits."}, {"p": "Acknowledge all Information-level alerts on {org} older than 30 days. Show me the list before you act.", "get": "A cleaner alert queue, after your confirmation."}, {"p": "Write the remediation status for {org} as a one-page update: done, in progress, blocked, and what we need from the client.", "get": "A status update for the weekly call."}]}}, "books": [{"title": "Monday briefing", "when": "Weekly · 5 minutes", "st ", "steps": [["Generate an executive summary of the attack surface and main risks of {org}.", "The narrative."], ["Check the numbers: deduplicate and state what data you used.", "A report you can defend."], ["Render it as an HTML page with a ranked risk list and a 30-day plan.", "Something to share."], ["Draft the cover email for the client.", "Sent the same day."]]}], "tools": ["Which customers and organizations you can see", "EASM credits, pentest slots and retest credits used and remaining", "Surface size, what's up, monitoring coverage, growth over N days", "Inventory, newest discoveries, unmonitored or down assets", "Subdomains EASM found under a domain", "Vendors, products and versions seen on the perimeter", "Open, overdue and due-soon findings with fix guidance", "Counts by severity, open criticals, unacknowledged alerts", "Open critical findings (new, ack or assigned)", "Exposed services, certificates, TLS, mail security", "CVEs on your assets, with CISA KEV and known-exploit flags", "Patrowl checks for newly published threats, and whether your assets came out impacted", "Lookalike domains with registrar, MX, web and parking status", "What fired and what nobody has looked at", "Acknowledge alerts. Changes data; Claude asks first", "Which fixes were verified and which failed", "A ready-made markdown posture summary"], "notes": [{"h": "Name the scope once", "p": "Say \"use tenant Acme\" at the start. Claude resolves the tenant to its organizations and keeps that scope for the rest of the conversation."}, {"h": "Watch the default-org tools", "p": "Vulnerabilities, alerts, retests and posture read your default organization. If you manage several, ask Claude to confirm which org it read, or to query vulnerabilities asset by asset."}, {"h": "Count before you list", "p": "On large tenants, ask for statistics first, then drill into one slice. Full inventory pulls can stop near 8,000 records; a <code>since</code> date or a <code>protection</code> filter keeps them s ktop, mobile and Claude Code", "s1_h": "Add the connector", "s1_p": "In claude.ai or Claude Desktop, open Settings → Connectors → Add custom connector. Name it Patrowl, paste the server URL and leave the OAuth Client ID and Secret empty. Click Add.", "s1_note": "Your admin already added Patrowl for everyone? Skip to step 2.", "s2_h": "Sign in", "s2_p": "Click Connect next to Patrowl, approve the consent page and sign in with your Patrowl Dashboard account. The connector shows Connected.", "s3_h": "Ask", "s3_p": "In a new chat, open the + menu and check that Patrowl is on. The connector follows your Claude account: it also works on mobile and in Claude Code."}, "code": {"tab": "Claude Code", "works": "Claude Code in the terminal and the Code tab of Claude Desktop", "s1_h": "Add the server", "s1_p": "Open a terminal (Terminal on macOS, PowerShell on Windows) and run this command. --scope user makes Patrowl available in every folder.", "s2_h": "Sign in", "s2_p": "Start claude, type /mcp, select patrowl, then Authenticate. Approve the consent page and sign in with your Patrowl Dashboard account. The terminal shows Authentication successful.", "s3_h": "Ask", "s3_p": "Ask in any Claude Code session. In Claude Desktop, open the Code tab and start a Local session."}, "claude_warn": "Choose the Claude connector or Claude Code, not both: with both, Claude loads every Patrowl tool twice.", "chatgpt": {"tab": "ChatGPT", "works": "chatgpt.com, on the web", "req": "Needs a ChatGPT Business, Enterprise or Edu plan. Your workspace admin may first have to allow custom apps (developer mode).", "s1_h": "Add the app", "s1_p": "On chatgpt.com, open Settings → Apps and click Create. If asked, turn on Developer mode. Name it Patrowl, paste the server URL, choose OAuth and leave the Client ID and Secret empty. Accept the warning, then Create.", "s1_note": "Your admin already published Patrowl for the workspace? Skip to step 2.", "s2_h": "Sign in", "s2_p": "Click Connect on the Patrowl app, ro mantengono gli inventari di grandi dimensioni entro i limiti dei tool. Specificare la forma dell'output ti dà una tabella, un elenco ordinato o una pagina invece di un muro di testo."}, "placeholders": {"tenant": "Acme Group", "org": "Acme Corp", "domain": "acme.com", "cve": "CVE-2024-3400", "technology": "Fortinet FortiOS", "date": "2026-10-01"}, "cats": {"sum": {"name": "Sintesi", "blurb": "Letture rapide della tua situazione. Usale per aprire una riunione o una settimana.", "prompts": [{"p": "Dammi la postura di sicurezza di {org} in un paragrafo: vulnerabilità aperte per severità, alert non presi in carico e l'unica cosa da correggere per prima.", "get": "Uno stato in cinque righe con una sola priorità chiara."}, {"p": "Cosa è cambiato su {org} dal {date}? Nuovi asset, nuove vulnerabilità, nuovi risk insight e nuovi domini lookalike, dal più recente.", "get": "Un change log raggruppato per tipo, con i conteggi in cima."}, {"p": "Riepiloga ogni organizzazione del tenant {tenant} in un'unica tabella: numero di asset, copertura del monitoraggio, vulnerabilità critiche aperte e finding scaduti.", "get": "Una vista di portafoglio per MSSP o team di sicurezza di gruppo."}, {"p": "Spiega i 3 rischi principali di {org} a un CFO in meno di 150 parole. Niente gergo, una frase ciascuno sull'impatto di business.", "get": "Descrizioni dei rischi in linguaggio semplice, pronte per una slide del CdA."}, {"p": "Genera la sintesi di sicurezza di {org} dal {date} ed evidenzia tutto ciò che è peggiorato.", "get": "La sintesi markdown integrata, con le regressioni in evidenza."}, {"p": "Quali organizzazioni del tenant {tenant} richiedono attenzione questa settimana, e perché? Ordinale.", "get": "Un breve elenco ordinato con un motivo per organizzazione."}]}, "rpt": {"name": "Reporting", "blurb": "Documenti e pagine da consegnare a qualcun altro. Chiedi il formato che ti serve.", "prompts": [{"p": "Crea una pagina di briefing executive per {org}: superficie d'attacco a colpo d'oc ck di Patrowl per {org}, poi elenca gli asset impattati con criticità, esposizione e stato del monitoraggio.", "get": "Un sì o un no, con l'elenco degli asset a dimostrarlo."}, {"p": "Quali trending attack ha verificato Patrowl su {org} dal {date}, e quali sono risultati impattati o potenzialmente impattati?", "get": "Nuove minacce già testate sui tuoi asset."}, {"p": "Usiamo {technology}. Quali CVE si applicano e quali asset di {org} la espongono su internet?", "get": "Mappatura tra tecnologia ed esposizione."}, {"p": "Scrivi un advisory interno per {cve}: di cosa si tratta, chi in {org} è esposto, la mitigazione e la scadenza.", "get": "Un advisory di una pagina da diffondere."}, {"p": "Elenca le CVE che interessano gli asset di {org} e che sono nel CISA KEV o hanno un exploit pubblico, dalla severità più alta.", "get": "CVE ordinate per rischio reale."}, {"p": "Verifica {cve} su ogni organizzazione del tenant {tenant} e dammi una riga per organizzazione.", "get": "Esposizione dell'intero gruppo a una singola CVE."}]}, "typ": {"name": "Typosquatting", "blurb": "Separa i veri tentativi di impersonificazione dagli omonimi, poi intervieni su quelli che contano.", "prompts": [{"p": "Elenca i domini lookalike di {domain} registrati negli ultimi 12 mesi che hanno server di posta.", "get": "I domini con più probabilità di inviare phishing."}, {"p": "Ordina i lookalike di {org} per potenziale di phishing: sito web attivo, record MX, registrazione recente. Prima elimina i duplicati.", "get": "Una shortlist ordinata invece di centinaia di righe."}, {"p": "Quali lookalike rilevati sono in realtà nostri? Confrontali con l'elenco degli asset di {org}.", "get": "Falsi positivi da segnare come di proprietà."}, {"p": "Crea una coda di takedown per {org}: dominio, evidenze, registrar e il motivo per cui impersona il brand.", "get": "Una coda su cui il tuo fornitore di takedown può agire."}, {"p": "Quali lookalike monitorati di {org} sono cambiati di recente, ad esempio un dominio nternet e non monitorato?", "Il sottoinsieme urgente."], ["Scrivi l'advisory e crea un ticket per ogni asset impattato.", "Azione, non solo consapevolezza."]]}, {"title": "Takedown dei lookalike", "when": "Mensile", "steps": [["Elenca i lookalike di {org}, senza duplicati.", "Elimina le ripetizioni per dominio."], ["Rimuovi quelli che sono nostri o omonimi di lunga data.", "Riduce i falsi positivi."], ["Ordina i restanti per MX, sito attivo e data di registrazione.", "Potenziale di phishing."], ["Crea la coda di takedown con le evidenze.", "Pronta per il fornitore."]]}, {"title": "Remediation a 30 giorni", "when": "Dopo un assessment", "steps": [["Raggruppa i finding aperti di {org} per causa radice.", "Meno correzioni, ma più incisive."], ["Ordina le correzioni per rischio eliminato per ora di lavoro.", "Prima il miglior ritorno."], ["Trasforma ogni passaggio in un ticket con un test di accettazione.", "Lavoro tracciabile."], ["Elenca cosa ritestare quando ogni passaggio viene completato.", "La prova che è risolto."]]}, {"title": "Briefing executive", "when": "Mensile o trimestrale", "steps": [["Genera un executive summary della superficie d'attacco e dei principali rischi di {org}.", "La narrazione."], ["Verifica i numeri: elimina i duplicati e indica quali dati hai usato.", "Un report che puoi difendere."], ["Generalo come pagina HTML con un elenco ordinato dei rischi e un piano a 30 giorni.", "Qualcosa da condividere."], ["Scrivi una bozza dell'email di accompagnamento per il cliente.", "Inviata in giornata."]]}], "tools": ["Quali clienti e organizzazioni puoi vedere", "Crediti EASM, slot di pentest e crediti di retest usati e rimanenti", "Dimensione della superficie, cosa è attivo, copertura del monitoraggio, crescita su N giorni", "Inventario, ultime scoperte, asset non monitorati o non attivi", "Sottodomini trovati da EASM sotto un dominio", "Vendor, prodotti e versioni rilevati sul perimetro", "Finding aperti, scaduti e in scadenza, con indicazioni per la co wl per rispondere alle tue domande e non può creare, modificare o eliminare nulla nel tuo account."}], "x": {"cta_install": "Installa in 3 passaggi", "cta_prompts": "Sfoglia i 48 prompt", "demo": {"label": "Esempio", "you": "Tu", "assistant": "Claude + Patrowl", "prompt": "Siamo impattati da CVE-2024-3400? Controlla prima il risultato del trending attack di Patrowl per Acme Corp.", "reading": "Lettura di Patrowl", "answer": "Sì. 2 asset di Acme Corp esposti su internet eseguono la versione vulnerabile. Entrambi sono critici e uno non è ancora monitorato: inizia da lì.", "note": "Risposta illustrativa, non dati reali.", "replay": "Riproduci"}, "sections": {"install_eyebrow": "Sezione 01", "install_h": "Collega il tuo assistente", "install_p": "Tre passaggi, nessun token API, nessun codice. Scegli l'assistente che usi.", "prompts_eyebrow": "Sezione 02", "prompts_h": "Libreria di prompt", "prompts_p": "48 prompt in 8 categorie. Compila il tuo perimetro una volta sola, poi copia.", "pb_eyebrow": "Sezione 03", "tm_eyebrow": "Sezione 04", "fn_eyebrow": "Sezione 05"}, "install": {"before_h": "Prima di iniziare", "f1_h": "Nessun token API", "f1_p": "Accedi una volta sola con il tuo account Patrowl Dashboard, nel browser.", "f2_h": "Valgono i tuoi permessi", "f2_p": "L'assistente vede solo i dati che il tuo account Patrowl può vedere.", "f3_h": "Sessioni", "f3_p": "Una sessione termina dopo 8 ore di inattività, oppure 7 giorni dopo l'accesso. A quel punto, connettiti di nuovo.", "pick": "Il tuo assistente", "works_in": "Funziona in", "step": "Passaggio", "copy": "Copia", "url_label": "URL del server", "claude": {"tab": "Claude", "works": "claude.ai, Claude Desktop, mobile e Claude Code", "s1_h": "Aggiungi il connettore", "s1_p": "In claude.ai o Claude Desktop, apri Settings → Connectors → Add custom connector. Chiamalo Patrowl, incolla l'URL del server e lascia vuoti i campi OAuth Client ID e Secret. Fai clic su Add.", "s1_note": "Il tuo amministratore ha già aggiunto Patrowl per tutti? Passa al passaggio 2.", "s2_h": "Accedi", "s2_p": "Fai clic su Connect accanto a Patrowl, approva la pagina di consenso e accedi con il tuo account Patrowl Dashboard. Il connettore mostra Connected.", "s3_h": "Chiedi", "s3_p": "In una nuova chat, apri il menu + e verifica che Patrowl sia attivo. Il connettore segue il tuo account Claude: funziona anche su mobile e in Claude Code."}, "code": {"tab": "Claude Code", "works": "Claude Code nel terminale e la scheda Code di Claude Desktop", "s1_h": "Aggiungi il server", "s1_p": "Apri un terminale (Terminal su macOS, PowerShell su Windows) ed esegui questo comando. --scope user rende Patrowl disponibile in ogni cartella.", "s2_h": "Accedi", "s2_p": "Avvia claude, digita /mcp, seleziona patrowl, poi Authenticate. Approva la pagina di consenso e accedi con il tuo account Patrowl Dashboard. Il terminale mostra Authentication successful.", "s3_h": "Chiedi", "s3_p": "Chiedi in qualsiasi sessione di Claude Code. In Claude Desktop, apri la scheda Code e avvia una sessione Local."}, "claude_warn": "Scegli il connettore Claude oppure Claude Code, non entrambi: con entrambi, Claude carica ogni tool di Patrowl due volte.", "chatgpt": {"tab": "ChatGPT", "works": "chatgpt.com, sul web", "req": "Richiede un piano ChatGPT Business, Enterprise o Edu. L'amministratore del tuo workspace potrebbe dover prima consentire le app personalizzate (modalità sviluppatore).", "s1_h": "Aggiungi l'app", "s1_p": "Su chatgpt.com, apri Settings → Apps e fai clic su Create. Se richiesto, attiva Developer mode. Chiamala Patrowl, incolla l'URL del server, scegli OAuth e lascia vuoti i campi Client ID e Secret. Accetta l'avviso, poi Create.", "s1_note": "Il tuo amministratore ha già pubblicato Patrowl per il workspace? Passa al passaggio 2.", "s2_h": "Accedi", "s2_p": "Fai clic su Connect sull'app Patrowl, approva la pagina di consenso e accedi con il tuo account Patrowl Dashboard. L'app mostra Connected.", "s3_h": "Chiedi", "s3_p": "In una chat,
